  - stock market
  - football
  - election

# ---- Magazine cross-cutting themes (for sorting the digest) ------
themes:
  "Sustainability & the Energy Transition": [low carbon, carbon, sustainab, energy, geothermal, hydrogen, storage, net zero, wind]
  "Digital Geotechnics": [digital, ai, artificial intelligence, machine learning, sensor, monitoring, bim, twin, drone, satellite, insar]
  "Hazards & Resilience": [landslide, landslip, rockfall, debris flow, liquefaction, earthquake, sinkhole, flood, collapse, failure, climate, resilience, subsidence]
  "Ground Improvement & Innovation": [ground improvement, grouting, soil nailing, geosynthetic, geogrid, stabilis, stabiliz, compaction, innovation]
  "Infrastructure & the Underground City": [tunnel, tbm, metro, basement, excavation, diaphragm wall, pile, piling, foundation, railway, road, bridge, embankment, earthworks]
  "Offshore, Coasts & Water": [offshore, monopile, coastal, port, quay, scour, dam, levee, dike, tailings, groundwater, river]
  "Characterisation & Modelling": [site investigation, borehole, cone penetration, cpt, laboratory, testing, model, numerical, characteris]
  "Geotechnics & Society": [education, award, profession, skills, safety, regulation, standard, code, eurocode, heritage]

# ---- Optional AI triage (used only if ANTHROPIC_API_KEY is set) ---
claude:
  model: claude-haiku-5-5   # Claude Haiku: the lowest-cost model, ample for this triage
  effort: low               # low | medium | high — how hard Claude thinks per batch
  max_candidates: 130     # best-scoring stories sent to Claude per run
  min_relevance: 3       # keep stories Claude rates 3/5 or higher
