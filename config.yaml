# Headlines containing these lose 5 points each (noise filter). Whole words
# only ("election" does not touch "selection"); Chinese and Japanese terms
# match anywhere, Korean ones at the start of a word; "*" works as in the
# keyword lists.
exclude:
  - share price
  - stock market
  - football
  - election
  # elections won "by a landslide"
  - landslide victory
  - landslide win
  - wins landslide
  - won a landslide
  - landslide majority
  - won in a landslide
  - wins in a landslide
  - win in a landslide
  - won by a landslide
  - wins by a landslide
  - win by a landslide
  - elected in a landslide
  - re-elected in a landslide
  - vote in a landslide
  # liquefied natural gas, not soil liquefaction
  - liquefied natural gas
  - lng liquefaction
  - gas liquefaction
  - liquefaction train
  - liquefaction plant
  - liquefaction capacity
  - liquefaction project
  - liquefaction expansion
  - liquefaction cargo
  # firms that "collapse" financially
  - into administration
  - insolvency
  # market slumps ("Borsa, titolo frana")
  - borsa
  - piazza affari
  # Japanese political and economic metaphors (地盤沈下, 液状化)
  - 経済の地盤沈下
  - 日本経済
  - 野党
  - 与党
  - 政界
  - 政権
  - 自民党
  # market crashes and attacks in Russian (обвал рынка, обрушился с критикой)
  - обвал* рынк*
  - обвал* рубл*
  - обвал* курс*
  - обвал* акци*
  - обвал* бирж*
  - обвал* цен*
  - рухнул* рынк*
  - обрушил* с критик*
  # Korean tunnel metaphors (the long tunnel of recession)
  - 불황의 터널
  - 터널의 끝
  - 긴 터널을
  # a flood of criticism, of votes (Spanish aluvión)
  - aluvión de críticas
  - aluvión de votos
  # traffic pile-ups and piling into investments
  - pile-up
  - pile up
  - piles up
  - piling into

# ---- Magazine cross-cutting themes (for sorting the digest) ------
themes:
  # Words of 6+ letters also match longer forms (sustainab -> sustainable);
  # shorter words must match whole (dam does not match damage).
  # The English concept names from both keyword lists count here too, which is
  # how non-English stories land in the right theme.
  "Sustainability & the Energy Transition": [low carbon, carbon, sustainab, energy, geothermal, hydrogen, storage, net zero, wind farm, wind turbine, wind power, wind energy, offshore wind, solar, renewable, decarbon, circular, recycl, emission]
  "Digital Geotechnics": [digital, ai-powered, ai-driven, ai-based, artificial intelligence, machine learning, sensor, monitoring, bim, digital twin, drone, satellite, insar, laser scanning, automat, robot, software, early warning]
  "Hazards & Resilience": [landslide, landslip, rockfall, debris flow, liquefaction, earthquake, sinkhole, flood, collapse, failure, climate, resilience, subsidence, dam failure, tunnel collapse, erosion, disaster, hazard, emergency, evacuat, monsoon, rainfall, storm, cyclone, typhoon]
  "Ground Improvement & Innovation": [ground improvement, grouting, jet grouting, soil nailing, geosynthetic, geogrid, stabilis, stabiliz, compaction, innovation, dewatering, retaining wall, reinforced soil, new technique]
  "Infrastructure & the Underground City": [tunnel, tbm, tunnel boring machine, metro line, basement, excavation, diaphragm wall, pile, piling, foundation, railway, road, highway, bridge, embankment, earthworks, underground, station, motorway]
  "Offshore, Coasts & Water": [offshore, monopile, coastal, coastal protection, port, quay, scour, dam, levee, dike, tailings, groundwater, river, harbour, harbor, seabed, marine, reservoir, canal]
  "Characterisation & Modelling": [site investigation, borehole, cone penetration, cpt, laboratory, testing, model, numerical, characteris, survey, geophysic, soil mechanics, rock mechanics, research, study, sampling]
  "Geotechnics & Society": [education, award, profession, skills, safety, regulation, standard, code, eurocode, heritage, conference, society, issmge, policy, training, inquiry, investigation report, lawsuit, community]

# ---- Optional AI triage (used only if ANTHROPIC_API_KEY is set) ---
claude:
  model: claude-haiku-5-5   # Claude Haiku: the lowest-cost model, ample for this triage
  effort: low               # low | medium | high — how hard Claude thinks per batch
  max_candidates: 130     # best-scoring stories sent to Claude per run
  min_relevance: 3       # keep stories Claude rates 3/5 or higher

# ---- Issue brief (Word document for the editorial meeting) -------
# Claude reads the quarter's stories and research papers and drafts the brief:
# an overview, a proposed line-up per theme, feature leads, Academia-to-Industry
# topics, a regional-balance check, gaps worth covering and a watch list. It uses
# the same ANTHROPIC_API_KEY secret as the triage. A draft is written by the daily
# scan in the last days_before_end days of the quarter and refreshed when it is
# refresh_days old; the final brief is written the day after the quarter closes.
# "Generate / update brief" on an issue page writes one at any time.
brief:
  model: claude-opus-5-5   # Claude Opus: the most capable model, for a once-a-quarter document
  effort: high             # low | medium | high — how hard Claude thinks about the line-up
  min_relevance: 3         # stories rated 3/5 or higher (keyword-ranked stories count too)
  max_per_theme: 40        # best stories per theme that Claude reads
  max_papers: 40           # best research papers that Claude reads
  days_before_end: 21      # automatic draft in the last 21 days of the quarter
  refresh_days: 7          # the draft is rewritten when it is 7 days old

# ---- Suggested issue layout (table of contents) ---------------------
# The sections of an issue, in the order they appear in the magazine. The
# issue pages show this layout, the issue brief proposes a table of contents
# that follows it, and the shared planning sheet's "Issue plan" tab is built
# from it (README: "Suggested issue layout").
# Rename, reorder, add or remove sections freely. Each section has:
#   name     the section's title
#   source   scanner  - filled from the news desk's stories, papers and events
#            society  - contributed by ISSMGE (the Board, TCs, member societies...)
#            editor   - written by the editor
#            mixed    - a society contribution plus items from the news desk
#   slots    how many items the news desk proposes (0 for society and editor sections)
#   pages    the usual length, as text ("4-6", "1", "as needed")
#   use      what goes there and which part of the news desk feeds it; the
#            issue brief reads this when it chooses the items
# A section that cannot be read is repaired or left out with a note in the log;
# if no section can be read, the layout below is used.
issue_layout:
  - name: Cover story
    source: scanner
    slots: 1
    pages: "4-6"
    use: "A developing story or a 5/5 feature lead: the quarter's strongest story, told at length"
  - name: Welcome from the President
    source: society
    slots: 0
    pages: "1-2"
    use: "The President's message, from ISSMGE"
  - name: Message from the Editor
    source: editor
    slots: 0
    pages: "1"
    use: "The editor's introduction to the issue"
  - name: From the Board / Vice-Presidents' reports
    source: society
    slots: 0
    pages: "4-8"
    use: "Reports from the Board and the regional Vice-Presidents"
  - name: ISSMGE Highlights
    source: society
    slots: 0
    pages: "3-4"
    use: "ISSMGE news and decisions; the dates of the quarter's ISSMGE events come from the events calendar"
  - name: Geotechnics in the News
    source: scanner
    slots: 10
    pages: "4-6"
    use: "8-12 short news items spread across the eight themes"
  - name: Lessons from the Field
    source: scanner
    slots: 1
    pages: "3-4"
    use: "A developing story told from the failure to the inquiry and the repair"
  - name: From Research to Practice
    source: scanner
    slots: 2
    pages: "2-3"
    use: "Research papers with a clear use in practice"
  - name: Global News from Member Societies + Regional Insight
    source: mixed
    slots: 6
    pages: "4-6"
    use: "Member societies' news, plus one story per ISSMGE region from the news desk; the world map shows the member-society countries with no stories"
  - name: Technical Committees Activities
    source: society
    slots: 0
    pages: "3-5"
    use: "TC reports and news; the TC symposia of the quarter come from the events calendar"
  - name: Young Members' Arena
    source: society
    slots: 0
    pages: "2"
    use: "Young members' news, events and profiles"
  - name: Education & Innovation
    source: mixed
    slots: 2
    pages: "2-3"
    use: "Courses and education news from the society, plus Digital Geotechnics stories from the news desk"
  - name: Corporate Associates Corner
    source: society
    slots: 0
    pages: "3-6"
    use: "News and project pieces from ISSMGE's corporate associates"
  - name: Heritage / Time Capsule
    source: society
    slots: 0
    pages: "1-2"
    use: "A look back at the profession's history"
  - name: In Memory
    source: society
    slots: 0
    pages: "as needed"
    use: "Obituaries"
  - name: Upcoming Events & Calls for Papers
