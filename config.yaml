# Headlines containing these lose 5 points each (noise filter). Whole words
# only ("election" does not touch "selection"); Chinese and Japanese terms
# match anywhere.
exclude:
  - share price
  - stock market
  - football
  - election
  # elections won "by a landslide"
  - landslide victory
  - landslide win
  - in a landslide
  - by a landslide
  - wins landslide
  - won a landslide
  - landslide majority
  # liquefied natural gas, not soil liquefaction
  - lng
  - liquefied natural gas
  - liquefaction train
  - liquefaction plant
  - liquefaction capacity
  # firms that "collapse" financially
  - into administration
  - insolvency
  # market slumps ("Borsa, titolo frana")
  - borsa
  - piazza affari
  # Japanese political and economic metaphors (地盤沈下, 液状化)
  - 経済
  - 野党
  - 与党
  - 政界
  - 政権
  - 自民党
  # traffic pile-ups and piling into investments
  - pile-up
  - pile up
  - piles up
  - piling into

# ---- Magazine cross-cutting themes (for sorting the digest) ------
themes:
  # Words of 6+ letters also match longer forms (sustainab -> sustainable);
  # shorter words must match whole (dam does not match damage).
  # The English concept names from both keyword lists count here too, which is
  # how non-English stories land in the right theme.
  "Sustainability & the Energy Transition": [low carbon, carbon, sustainab, energy, geothermal, hydrogen, storage, net zero, wind farm, wind turbine, wind power, wind energy, offshore wind, solar, renewable, decarbon, circular, recycl, emission]
  "Digital Geotechnics": [digital, ai-powered, ai-driven, ai-based, artificial intelligence, machine learning, sensor, monitoring, bim, digital twin, drone, satellite, insar, laser scanning, automat, robot, software, early warning]
  "Hazards & Resilience": [landslide, landslip, rockfall, debris flow, liquefaction, earthquake, sinkhole, flood, collapse, failure, climate, resilience, subsidence, dam failure, tunnel collapse, erosion, disaster, hazard, emergency, evacuat, monsoon, rainfall, storm, cyclone, typhoon]
  "Ground Improvement & Innovation": [ground improvement, grouting, jet grouting, soil nailing, geosynthetic, geogrid, stabilis, stabiliz, compaction, innovation, dewatering, retaining wall, reinforced soil, new technique]
  "Infrastructure & the Underground City": [tunnel, tbm, tunnel boring machine, metro line, basement, excavation, diaphragm wall, pile, piling, foundation, railway, road, highway, bridge, embankment, earthworks, underground, station, motorway]
  "Offshore, Coasts & Water": [offshore, monopile, coastal, coastal protection, port, quay, scour, dam, levee, dike, tailings, groundwater, river, harbour, harbor, seabed, marine, reservoir, canal]
  "Characterisation & Modelling": [site investigation, borehole, cone penetration, cpt, laboratory, testing, model, numerical, characteris, survey, geophysic, soil mechanics, rock mechanics, research, study, sampling]
  "Geotechnics & Society": [education, award, profession, skills, safety, regulation, standard, code, eurocode, heritage, conference, society, issmge, policy, training, inquiry, investigation report, lawsuit, community]

# ---- Optional AI triage (used only if ANTHROPIC_API_KEY is set) ---
claude:
  model: claude-haiku-5-5   # Claude Haiku: the lowest-cost model, ample for this triage
  effort: low               # low | medium | high — how hard Claude thinks per batch
  max_candidates: 130     # best-scoring stories sent to Claude per run
  min_relevance: 3       # keep stories Claude rates 3/5 or higher
