# ---- Keywords in other languages -----------------------------------
# Each English concept on the left is matched by any of the terms in
# other languages. A story that matches is scored, tagged and themed under
# the English concept, so a French "glissement de terrain" or an Arabic
# "انهيار أرضي" is filed exactly like an English "landslide".
# To add a language, append its words to the relevant "terms" lists.
# A "*" stands for the rest of a word, for languages that change word
# endings: оползн* matches оползня and оползни, 'подпорн* стен*' any form
# of подпорная стена, osuwisk* osuwisko and osuwiska. Keep the part before
# the "*" long enough not to start other words (skarp* would also find
# skarpety, socks), and list the forms instead when it is not.
# Korean terms must start a word (the particles after them still match:
# 산사태로), so 제방 (embankment) is not found in 규제방안 (regulatory measures).
# List the compounds that start with another word (하천제방, 대지진), or put
# a "*" in front of a term, in quotes, when it also ends names and compounds
# and is found in no other word: '*댐' finds 소양강댐 (Soyang River Dam).
multilingual_keywords:
  geotechnical:
    weight: 5
    terms: [géotechnique, géotechnicien, geotecnia, geotécnico, geotécnica, geotecnico, geotecnica,
            geoteknik, geotechnik, geotechnisch, baugrundgutachten, baugrunduntersuchung, bodengutachten,
            भू-तकनीकी, 岩土工程, 岩土, 地盤工学, جيوتقني, جيوتقنية, جيوتكنيك,
            địa kỹ thuật, ژئوتکنیک*, '*지반공학', 지반 공학, геотехни*, geotechni*]
  soil mechanics:
    weight: 5
    terms: [mécanique des sols, mecánica de suelos, mecânica dos solos, meccanica dei terreni, zemin mekaniği,
            bodenmechanik, mekanika tanah, 土力学, 土質力学, ميكانيكا التربة,
            cơ học đất, مکانیک خاک, 토질역학, 토질 역학, механик* грунт*, mechanik* grunt*]
  landslide:
    weight: 4
    terms: [glissement de terrain, glissements de terrain, éboulement, deslizamiento, deslave, derrumbe de tierra,
            deslizamento, desmoronamento, frana, frane, smottamento, smottamenti, heyelan, toprak kayması,
            erdrutsch, erdrutsche, hangrutschung, hangrutschungen, tanah longsor, longsor, भूस्खलन,
            山体滑坡, 滑坡灾害, 发生滑坡, 滑坡体, 土砂崩れ, 地すべり, 崖崩れ,
            انهيار أرضي, انزلاق أرضي, انهيارات أرضية, انزلاقات أرضية,
            sạt lở, lở đất, trượt lở, sạt trượt, زمین لغزش*, زمینلغزش*, رانش زمین, لغزش زمین, 산사태, 땅밀림, 토사 붕괴, 토사붕괴,
            оползень, оползн*, сход грунта, osuwisk*, osunięci* ziemi, osunięci* gruntu, osunięci* się ziemi,
            osunęła się ziemia, obsunięci* ziemi, remoción en masa, remociones en masa]
  debris flow:
    weight: 4
    terms: [lave torrentielle, coulée de boue, flujo de detritos, alud de lodo, corrida de lama, colata detritica,
            çamur akıntısı, murgang, 泥石流, 土石流, سيل طيني,
            lũ bùn đá, lũ bùn, جریان واریزه*, جریان گلی, 토석류, сель, селя, селем, селев*, грязев* поток*, lawin* błotn*,
            spływ* gruzow*, huaico, huaicos, huayco, huaycos, aluvión, aluviones]
  rockfall:
    weight: 4
    terms: [chute de pierres, chute de blocs, caída de rocas, desprendimiento de rocas, queda de rochas,
            caduta massi, kaya düşmesi, steinschlag, felssturz, batu runtuh, 落石, سقوط صخور, انهيار صخري,
            lở đá, đá lở, đá lăn, đá rơi, ریزش سنگ, سقوط سنگ, ریزش کوه, 낙석, камнепад*, обвал* скал*, obryw* skaln*,
            obryw* skał*]
  liquefaction:
    weight: 5
    terms: [liquéfaction, licuefacción, licuación, liquefação, liquefazione, sıvılaşma, bodenverflüssigung,
            likuifaksi, 砂土液化, 土壤液化, 液状化, تميع التربة, تسييل التربة,
            hóa lỏng đất, hoá lỏng đất, đất hóa lỏng, đất hoá lỏng, روانگرایی, روان گرایی, 액상화, разжижени* грунт*,
            разжижени* почв*, upłynnieni* grunt*, upłynnieni* podłoża]
  sinkhole:
    weight: 4
    terms: [effondrement karstique, fontis, doline, socavón, socavones, sumidero, dolina, cratera, voragine,
            obruk, erdfall, tanah ambles, amblesan, 天坑, 地面塌陷, 陥没, حفرة انهدامية, حفرة عميقة,
            hố tử thần, hố sụt, فروچاله*, فرو چاله*, '*싱크홀', 땅꺼짐, 땅 꺼짐, 지반 함몰, 지반함몰, 도로 함몰, 도로함몰, карстов* провал*,
            провал* грунт*, провал* асфальт*, zapadlisk*, zapadnięci* gruntu, zapadnięci* się gruntu,
            zapadnięci* jezdni, lej* krasow*]
  subsidence:
    weight: 3
    terms: [affaissement, hundimiento del terreno, subsidencia, afundamento do solo, subsidenza,
            cedimento del terreno, zemin çökmesi, bodenabsenkung, penurunan tanah, धंसाव, भू-धंसाव, 地面沉降, 沉降, 地盤沈下,
            هبوط أرضي, هبوط التربة,
            sụt lún, lún sụt, lún nứt, فرونشست*, 지반침하, 지반 침하, 침하, 부등침하, 압밀침하, 도로침하, просадк* грунт*, проседани* грунт*, оседани* грунт*,
            просел* грунт*, оседани* земн* поверхност*, osiadani* gruntu, osiadani* terenu, szkod* górnicz*,
            deformacj* terenu]
