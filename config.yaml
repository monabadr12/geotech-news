# ============================================================
#  ISSMGE Magazine — Geotechnical News Scanner : settings
#  Edit this file on GitHub to add/remove sources or keywords.
# ============================================================

# How far back to look on each run (hours). 60 h is safe for a
# daily run and also covers a run every two days.
lookback_hours: 60

# ---- Magazine and archive ---------------------------------------
# The archive groups digests into three-month "issue windows" that follow
# the magazine's quarterly cycle. issue_start_month is the month the first
# window of the year begins: 1 gives Jan–Mar, Apr–Jun, Jul–Sep, Oct–Dec;
# 2 gives Feb–Apr, May–Jul, and so on.
magazine:
  name: ISSMGE Magazine
  issue_start_month: 1
  # GitHub repository (owner/name): used by the website's "Scan now" button
  repository: monabadr12/geotech-news

# ---- AI assistant on the website -----------------------------------
# Web address of the assistant connector: the script in assistant/bridge.gs,
# deployed as a web app in your Google account (see README, "AI assistant").
# It holds the Anthropic key, so the website itself never needs one.
assistant:
  endpoint: "https://script.google.com/macros/s/AKfycbyUs--oM5Ig49YssyB8cf-wOK5DlVxGwLvtHAKNL9dXTon8xVSzQsI8_w2JgQOPpeh-/exec"


# Maximum stories shown in one digest.
max_items: 60

# Largest share of the digest one magazine theme may take: 0.3 = 30 %, i.e.
# at most 18 of 60 stories. Themes take turns, the theme with the best story
# first, so every theme that has candidates is represented. The same share caps
# each theme among the stories sent to Claude (claude: max_candidates below).
max_share_per_theme: 0.3

# At most 5 stories from one website per digest (0 = no limit; without this
# line the limit is 5). Copies of one story in several languages count once:
# Claude's English titles show them, and only the best copy is kept. Up to
# three times as many stories from one website go to Claude.
max_per_source: 5

# When the other themes run out of stories, should the free places go to more
# stories from the big themes (true), or should the digest stay shorter and
# balanced (false)?
fill_leftover_places: false

# Stories need at least this keyword score to be considered.
min_keyword_score: 3

# ---- Trade / technical websites --------------------------------
# You may give a site's home page: the scanner finds its RSS feed
# automatically. If a site shows under "Sources that failed" in the
# digest, replace its address with the site's RSS feed address (test
# candidates first with the "Check feeds" workflow on GitHub).
# "boost" adds points to stories from specialist geotechnical sources.
# Sites that block feed readers or publish no feed (GeoEngineer,
# Geosynthetica, ISSMGE, ASCE Geo-Institute, ICE, FHWA, GEER, USGS,
# ReliefWeb, Rail Business UK, Railway Gazette, International Construction,
# Construction Week) are searched through Google News instead: see
# google_news: extra_queries below.
feeds:
  # --- specialist geotechnical sources (weighted up) ---
  - {name: Ground Engineering,           url: "https://www.geplus.co.uk/feed/",          boost: 3}
  - {name: The Landslide Blog (Eos),     url: "https://eos.org/landslide-blog",          boost: 3}
  # --- societies and institutions ---
  - {name: Deep Foundations Institute,   url: "https://www.dfi.org",                     boost: 4}
  # --- trade press ---
  - {name: New Civil Engineer,           url: "https://www.newcivilengineer.com/feed/",  boost: 1}
  - {name: Tunnels & Tunnelling,         url: "https://www.tunnelsonline.info/feed/"}
  # in place of TunnelTalk, which GitHub's servers cannot reach
  - {name: Tunnelling Journal,           url: "https://tunnellingjournal.com/feed/",     boost: 2}
  - {name: Rail Technology Magazine,     url: "https://www.railtechnologymagazine.com/rss.xml"}
  - {name: World Highways,               url: "https://www.worldhighways.com"}
  - {name: Construction Enquirer,        url: "https://www.constructionenquirer.com/feed/"}
  - {name: Engineering News-Record,      url: "https://www.enr.com/rss/articles"}
  - {name: Mining.com (tailings, ground), url: "https://www.mining.com/feed/"}
  - {name: ScienceDaily Earth,           url: "https://www.sciencedaily.com/rss/earth_climate.xml"}
  - {name: Phys.org Earth Sciences,      url: "https://phys.org/rss-feed/earth-news/"}
  # --- Persian-language news (Google News has no Persian edition). General
  #     news: only stories that match the Persian keywords below go forward ---
  - {name: BBC Persian,                  url: "https://feeds.bbci.co.uk/persian/rss.xml", region: IR, language: fa}
  - {name: DW Persian,                   url: "https://rss.dw.com/rdf/rss-per-all", region: IR, language: fa}
  - {name: Euronews Persian,             url: "https://parsi.euronews.com/rss", region: IR, language: fa}
  - {name: Independent Persian,          url: "https://www.independentpersian.com/rss.xml", region: IR, language: fa}
  - {name: Hamshahri Online,             url: "https://www.hamshahrionline.ir/rss", region: IR, language: fa}
  - {name: Mehr News,                    url: "https://www.mehrnews.com/rss", region: IR, language: fa}

# ---- Google News searches (worldwide coverage) -------------------
google_news:
  # Default edition for queries that don't name their own.
  language: en
  country: GB

  # The same core geotechnical searches are run across several English-language
  # editions so that stories from every continent surface, not only UK/US ones.
  editions:
    - {language: en, country: GB}   # UK / Europe
    - {language: en, country: US}   # Americas
    - {language: en, country: IN}   # South Asia
    - {language: en, country: AU}   # Australia / Pacific
    - {language: en, country: ZA}   # Africa
    - {language: en, country: SG}   # South-East Asia
    - {language: en, country: AE}   # Middle East

  # Core searches — run in EVERY edition above.
  core_queries:
    - '"geotechnical"'
    - 'landslide OR landslip OR rockfall OR "debris flow"'
    - 'liquefaction OR sinkhole OR "land subsidence"'
    - '"ground improvement" OR "deep foundations" OR "piling works"'
    - '"tunnel boring machine" OR "tunnel collapse" OR "metro tunnel"'
    - '"embankment failure" OR "dam failure" OR "tailings dam"'
    - '"retaining wall" collapse OR "excavation collapse" OR "slope failure"'
    - '"soil mechanics" OR "geotechnical engineering"'

  # Extra searches — run once, in the edition named (or the default).
  extra_queries:
    - '"monopile" OR "offshore wind foundations"'
    - '"site investigation" OR "cone penetration test" OR "geophysical survey"'
    - 'GEER reconnaissance OR "geotechnical reconnaissance" earthquake'
    - 'ISSMGE OR "soil mechanics conference"'
    - 'permafrost thaw infrastructure OR "expansive soil" damage'
    - 'sabkha OR "collapsible soil" OR "karst" foundation'
    # --- sites that block feed readers, read through Google News instead;
    #     "boost" adds points as it does for the websites above ---
    - {q: 'site:geoengineer.org', country: US, boost: 3}                                  # GeoEngineer
    - {q: '"geosynthetic" OR "geosynthetics" OR "geomembrane" OR "geogrid" OR "geotextile"', country: US}  # for Geosynthetica
    - {q: 'site:issmge.org', boost: 4}                                                    # ISSMGE
    # The Geo-Institute and GEER publish rarely, so their searches (this one and
    # GEER's below) also catch coverage of them elsewhere, and still find nothing
    # on most days. ("site:" in an OR list finds nothing once a word is ANDed to it.)
    - {q: 'site:geoinstitute.org', country: US, boost: 4}  # ASCE Geo-Institute's own news (only the site: search finds it)
    - {q: '"Geo-Institute" OR "Geo-Congress" OR GeoStrata OR "Geo-Frontiers" OR "geotechnical engineering" ASCE', country: US, boost: 4}  # coverage of the Geo-Institute
    # -"job with" leaves out the job ads of ASCE's job board (-site: does not work in Google News)
    - {q: 'site:asce.org geotechnical OR "Geo-Institute" OR foundations OR tunnel OR landslide -"job with" -"Career Connections"', country: US, boost: 2}
    - {q: 'site:ice.org.uk', boost: 2}                                                    # ICE
    - {q: 'site:highways.dot.gov OR site:fhwa.dot.gov', country: US, boost: 2}            # FHWA
    - {q: '"GEER" earthquake OR landslide OR reconnaissance OR liquefaction', country: US, boost: 4}  # GEER
    - {q: 'site:usgs.gov landslide OR landslides OR liquefaction OR subsidence OR sinkhole OR "ground failure"', country: US, boost: 3}  # USGS
    - {q: 'site:reliefweb.int landslide OR landslides OR mudslide OR "dam collapse"'}     # ReliefWeb
    - {q: 'site:railbusinessuk.com tunnel OR embankment OR earthworks OR cutting OR landslip OR geotechnical OR piling OR viaduct OR drainage'}
    - {q: 'site:railwaygazette.com tunnel OR tunnelling OR embankment OR earthworks OR landslide OR geotechnical OR piling OR viaduct'}
    - {q: 'site:constructionbriefing.com tunnel OR tunnelling OR foundations OR piling OR geotechnical OR excavation OR dam'}  # International Construction, now Construction Briefing
    - {q: 'site:constructionweekonline.com tunnel OR foundation OR piling OR geotechnical OR excavation OR metro OR dewatering', country: AE}
    # --- non-English editions (Claude reads these and gives an English title) ---
    - {q: 'glissement de terrain OR "étude géotechnique" OR effondrement', language: fr, country: FR, bonus: 6}
    - {q: '"génie civil" fondations OR tunnel OR digue', language: fr, country: SN, bonus: 6}
    - {q: 'انهيار أرضي OR "دراسة جيوتقنية" OR "هبوط أرضي" OR أساسات', language: ar, country: EG, bonus: 6}
    - {q: 'انهيار نفق OR جدار استنادي OR تربة', language: ar, country: AE, bonus: 6}
    - {q: 'deslizamiento de tierra OR socavón OR "estudio geotécnico"', language: es, country: ES, bonus: 6}
    # Latin American editions use es-419, the Spanish of Latin America
    - {q: 'deslizamiento OR licuefacción OR "muro de contención" colapso', language: es-419, country: MX, bonus: 6}
    - {q: '"deslizamiento de tierra" OR "remoción en masa" OR socavón OR "pérdida de banca"', language: es-419, country: CO, bonus: 6}
    - {q: '"remoción en masa" OR socavón OR aluvión OR "tranque de relaves"', language: es-419, country: CL, bonus: 6}
    - {q: 'huaico OR "deslizamiento de tierra" OR "presa de relaves" OR "estudio de suelos"', language: es-419, country: PE, bonus: 6}
    - {q: '"deslizamiento de tierra" OR hundimiento OR socavón OR "estudio de suelos"', language: es-419, country: AR, bonus: 6}
    - {q: 'deslizamento de terra OR "barragem de rejeitos" OR geotecnia', language: pt, country: BR, bonus: 6}
    - {q: 'Hangrutschung OR Baugrundgutachten OR Tunnelvortrieb', language: de, country: DE, bonus: 6}
    - {q: 'frana OR "cedimento del terreno" OR geotecnica', language: it, country: IT, bonus: 6}
    - {q: 'heyelan OR zemin etüdü OR tünel çökmesi', language: tr, country: TR, bonus: 6}
    - {q: 'भूस्खलन OR "मिट्टी" धंसाव OR सुरंग', language: hi, country: IN, bonus: 6}
    - {q: 'tanah longsor OR "penurunan tanah" OR terowongan', language: id, country: ID, bonus: 6}
    - {q: '山体滑坡 OR 地面沉降 OR 岩土工程', language: zh, country: CN, bonus: 6}
    - {q: '地盤沈下 OR 液状化 OR 斜面崩壊', language: ja, country: JP, bonus: 6}
    - {q: '"sạt lở" OR "sụt lún" OR "hố tử thần" OR "địa kỹ thuật"', language: vi, country: VN, bonus: 6}
    - {q: '"sập hầm" OR "nền đất yếu" OR "vỡ đê" OR "tường chắn"', language: vi, country: VN, bonus: 6}
    - {q: '산사태 OR 싱크홀 OR 땅꺼짐 OR 지반침하 OR 흙막이', language: ko, country: KR, bonus: 6}
    - {q: '옹벽 붕괴 OR "터널 붕괴" OR 액상화 OR 지반조사', language: ko, country: KR, bonus: 6}
    - {q: 'оползень OR "провал грунта" OR котлован OR "инженерно-геологические изыскания"', language: ru, country: RU, bonus: 6}
    - {q: '"подпорная стена" OR "провал грунта" OR "обрушение тоннеля" OR "сход оползня"', language: ru, country: RU, bonus: 6}
    - {q: 'osuwisko OR zapadlisko OR "szkody górnicze" OR "badania geotechniczne"', language: pl, country: PL, bonus: 6}
    - {q: '"osunięcie ziemi" OR "katastrofa budowlana" OR "ściana oporowa" OR "wał przeciwpowodziowy"', language: pl, country: PL, bonus: 6}
    # Persian: Google News has no Persian edition, so Persian news sites are
    # read directly (see feeds above)

# ---- New research papers (Academia-to-Industry) --------------------
# Each run asks Crossref (free, no key needed) for the papers that the
# journals below registered in the last few days. Papers are scored and
# themed with the same keywords as the news; with the Claude key, Claude
# rates each 1-5 for its use in practice and says in one sentence why it
# matters to practitioners. A paper is shown once: papers are remembered
# by DOI. Add a journal with its ISSN (print or online, as Crossref lists
# it); the "Check feeds" workflow tests the whole list when given
# {"research": true}.
research:
  lookback_days: 4        # papers registered in the last 4 days
  max_papers: 20          # papers kept per digest, spread across the themes
  max_candidates: 40      # best-scoring papers sent to Claude per run (one batch)
  min_relevance: 3        # with Claude: keep papers rated 3/5 or higher for practice
  mailto: ""              # optional contact e-mail Crossref may use about heavy use
  journals:
    - {name: Géotechnique,                                         issn: "0016-8505"}
    - {name: Géotechnique Letters,                                 issn: "2045-2543"}
    - {name: Canadian Geotechnical Journal,                        issn: "0008-3674"}
    - {name: Journal of Geotechnical and Geoenvironmental Engineering (ASCE), issn: "1090-0241"}
    - {name: Soils and Foundations,                                issn: "0038-0806"}
    - {name: Acta Geotechnica,                                     issn: "1861-1125"}
    - {name: Computers and Geotechnics,                            issn: "0266-352X"}
    - {name: Engineering Geology,                                  issn: "0013-7952"}
    - {name: Landslides,                                           issn: "1612-510X"}
    - {name: Tunnelling and Underground Space Technology,          issn: "0886-7798"}
    - {name: Geotextiles and Geomembranes,                         issn: "0266-1144"}
    - {name: International Journal of Geomechanics (ASCE),         issn: "1532-3641"}
    - {name: Transportation Geotechnics,                           issn: "2214-3912"}
    - {name: "Proceedings of the ICE: Geotechnical Engineering",   issn: "1353-2618"}
    - {name: Geotechnical Testing Journal,                         issn: "0149-6115"}
    - {name: Soil Dynamics and Earthquake Engineering,             issn: "0267-7261"}
    - {name: Rock Mechanics and Rock Engineering,                  issn: "0723-2632"}
    - {name: Journal of Rock Mechanics and Geotechnical Engineering, issn: "1674-7755"}
    - {name: Bulletin of Engineering Geology and the Environment,  issn: "1435-9529"}
    - {name: Georisk,                                              issn: "1749-9518"}
    - {name: Geosynthetics International,                          issn: "1072-6349"}
    - {name: International Journal for Numerical and Analytical Methods in Geomechanics, issn: "0363-9061"}
    - {name: Underground Space,                                    issn: "2467-9674"}
    - {name: Geomechanics for Energy and the Environment,          issn: "2352-3808"}
    - {name: Quarterly Journal of Engineering Geology and Hydrogeology, issn: "1470-9236"}

