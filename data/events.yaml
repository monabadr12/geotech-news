# ============================================================
#  Events calendar — the editors' list (shown on the Events page)
#  Edit this file on GitHub (pencil icon); the website is rebuilt
#  a minute or two after you save ("Commit changes").
# ============================================================
#
# Each event starts with "- name:" and has these lines (only name, start and url
# are needed; leave out any line you do not know):
#
#   - name: 2nd International Symposium on Ground Improvement   full official name
#     short: IS-GI 2027              acronym shown on the cards and in calendar apps
#     start: 2027-04-12              first day, YYYY-MM-DD (or YYYY-MM if only the month is known)
#     end: 2027-04-14                last day (leave out for a one-day event)
#     city: Lyon
#     country: FR                    two-letter country code (FR, GB, US, TH ...); leave out if online
#     online: false                  true for an event held online only
#     organiser: ISSMGE TC211
#     kind: ISSMGE-supported         one of: ISSMGE conference / ISSMGE-supported /
#                                    Other conference / Course / webinar
#     issmge: true                   only needed to count another kind (an ISSMGE webinar,
#                                    a member society's conference) as an ISSMGE event
#     url: https://...               the event's web page (where readers register)
#     deadlines:                     calls for abstracts or papers, registration ...
#       - label: Abstracts
#         date: 2026-05-15
#       - label: Full papers
#         date: 2026-11-30
#     notes: Official site www.example.org   one line for the editors (optional)
#
# Kinds: "ISSMGE conference" is organised by ISSMGE or held under its auspices (the
# International Conference, the regional conferences); "ISSMGE-supported" is a
# technical committee (TC) symposium or another event ISSMGE supports; "Other
# conference" is everything else (ITA-AITES, ASCE, ISRM, IGS, DFI ...); "Course /
# webinar" is a short course, workshop or online lecture. ISSMGE events can be
# shown on their own with the "ISSMGE only" filter.
#
# Tips
# * Keep the indentation (two spaces) and the "- " in front of each event and each
#   deadline. Put text containing a colon in quotes: notes: "Venue: METU campus".
# * Passed deadlines stay on the card, struck through; past events move to "Past
#   events" at the bottom of the page by themselves, so there is no need to delete them.
# * The weekly calendar refresh adds events it finds on the organisers' websites.
#   An event listed here always wins over the same event found by the refresh, so
#   this file is the place to correct a date or a link.
# * If something in this file cannot be read, the Events page says what and where.

