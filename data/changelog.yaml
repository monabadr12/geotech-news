# Change log and open items for the website report (docs/reports/site-report.docx).
# Newest first. The report is rebuilt from this file after every scan.

# What the website does (shown at the start of the report). "Name: description".
features:
  - "Daily scan: every day at 05:00 Cairo time, and on demand with Scan now, the scanner reads specialist, society and trade-press websites, worldwide Google News searches in English and 16 other languages, and new papers from geotechnical journals."
  - "Categorisation: every headline, in any covered language, is scored against weighted geotechnical keywords and filed under one of the magazine's eight themes; Claude then rates it 1-5 in two steps (is it truly geotechnical, and how big is it: local or small, national or regional, international or a landmark project), confirms the theme, suggests an editorial use, writes a magazine angle and translates foreign headlines."
  - "Balanced digests: no theme may take more than 30 % of a digest and no website more than five stories, several outlets reporting the same event are merged into one story, and copies of one story in several languages count once."
  - "Archive: every digest is kept permanently and grouped into three-month issue windows that follow the magazine's cycle, each with an issue page."
  - "Issue brief: for each issue window Claude drafts a Word brief for the editorial meeting - a proposed table of contents that follows the suggested issue layout, a proposed line-up per theme, feature leads, Academia-to-Industry topics, a regional-balance check and gaps worth covering. Drafts appear in the last weeks of each quarter, a final brief after it closes, and on demand from the issue page."
  - "Suggested issue layout: a default table of contents for the magazine (16 sections, from the cover story to upcoming events) in config.yaml, saying which sections the scanner feeds and how many items each takes; the issue pages show it and the editors can rename, reorder, add or remove sections."
  - "Shared planning sheet: the AI assistant's Google connector keeps a Google spreadsheet for the editorial team, updated every morning with the stories of the current and previous quarter and an issue plan built from the layout, without ever changing the team's Status, Assigned to and Editor notes."
  - "Research papers: new papers from journals such as Géotechnique, Canadian Geotechnical Journal, ASCE JGGE, Soils and Foundations and Acta Geotechnica arrive through Crossref, with a one-line note on why each matters for practice."
  - "Trends: a page charting stories per month and per quarter by theme, theme shares over time, rising keywords, regions, editorial uses and sources."
  - "World map: Claude reads where each story happened (country and town, region or site); the World map plots stories by country for any issue window and marks the ISSMGE member-society countries with no stories, region by region, so coverage gaps are visible."
  - "Developing stories: each scan links follow-up reports (the response, the inquiry, the repair, the court case) to the earlier story about the same event, project or site, with the stage reached; each developing story has a timeline, and story cards carry a Developing story chip."
  - "Events calendar: conferences, symposia and courses with their deadlines (calls for papers, registration), from the editors' list (data/events.yaml) and a weekly refresh in which Claude reads the organisers' calendars; a calendar feed to subscribe to, and the next deadlines beside the news."
  - "Alerts and weekly summary: an e-mail after any scan that finds a new 5/5 story, and every Monday a summary of the week for the editorial team (top stories rated 4 and 5, developing stories, regional coverage, events and research), also kept as web pages."
  - "Search and AI assistant: search every archived story with filters, or ask the AI assistant, which knows the developing stories and the events calendar and can also read attached PDF and Word documents."
  - "Excel workbooks: one per issue window and one for the whole archive, with an interactive dashboard, planning columns and a reading view by theme."
  - "Website report: this document, rebuilt after every scan."
  - "Copyright-safe outputs: nothing the news desk publishes or now saves carries a publisher's text beyond the headline (no feed summaries, abstracts or images); each story names the primary source to check the facts with; the AI assistant and the issue brief write in their own words and quote a sentence or two at most, and the assistant ends its drafts with a Check before publishing list; and every page, workbook, e-mail and report carries the five steps of Before you use a story."

changes:
  - date: 2026-10-26
    title: Ratings by size
    items:
      - "Claude now rates each story 1-5 in two steps. First: is it truly geotechnical, with a clear ground-engineering element? If not, it gets 1 (not geotechnical) or 2 (the ground is mentioned only in passing) and is dropped, however big the news. Then, only for a geotechnical story, its size and importance: 3 = local or small, 4 = national or regional importance, 5 = international importance or a landmark project, judged by the consequences and lessons for ground engineering, not by how much media attention the story gets. Stories rated 3 or more are kept, as before. Ratings given before this change measured geotechnical substance alone."
      - "The daily page (Latest and each day's digest page) and the weekly summary (its page and its e-mail) list the stories rated 4 and 5. The stories rated 3 are not deleted: on the day's page they are in a closed section at the end, Smaller local stories (rated 3), with their number, and the weekly summary says how many there were and that they are in the archive. Everywhere else they stay as before: the archive, Search, the world map, the issue pages, the CSV, Excel and JSON downloads, developing stories and the issue brief. Stories without a Claude rating (ranked by keywords) are shown as before. Alerts still go out for 5/5 stories, which now means international importance or a landmark project."
  - date: 2026-10-26
    title: Searches for Africa and Australasia
    items:
      - "Five new Google News searches - of the 150 stories in the 24 to 26 October digests, Claude located none in Africa and two in Australasia: the English editions for South Africa and Australia return mostly the same worldwide stories as the other editions. The new searches name the countries: Nigeria (building collapses, gully erosion, dam collapses, soil tests); Kenya, Uganda, Tanzania, Rwanda and Ethiopia (landslides, sinkholes, building collapses, dam bursts, gully erosion); Ghana (mining-pit and building collapses, coastal erosion, the Akosombo dam, sinkholes); Morocco, Algeria, Tunisia and Libya, in Arabic (landslides, dam, building and house collapses, geotechnical studies); and New Zealand (landslides, liquefaction, retaining walls, sinkholes, tunnel boring machines). They were tried from GitHub with the Check feeds workflow (the Nigeria and Ghana searches term by term) before being added. Searches for French-speaking Africa, South Africa, southern Africa, the Pacific islands and Australia found almost nothing relevant in three days and were left out."
      - "Their stories get 4 extra points (boost) when a keyword matches: on its own a building collapse scores 1 and erosion 2, too little to pass the keyword filter or to reach Claude ahead of the many one-keyword stories (4 points) from elsewhere. Claude now reads up to 145 headlines a day instead of 130 (max_candidates), so the new stories do not push others out, for well under one US cent a day more; an excluded headline (an election won by a landslide) gets no extra points; and Claude's rating decides, as for every story, what goes into the digest. The Google News editions of Nigeria, Kenya, Ghana, Morocco and New Zealand are shown by name."
  - date: 2026-10-26
    title: An English translation for every foreign headline
    items:
      - "Missing translations - in the 26 October digest, 24 of the 39 headlines in other languages (most of them Spanish and Portuguese) had no English translation, against a handful on earlier days. Since 25 October the triage prompt had said that the outlets' headlines are not to be reused, which Claude most likely took to include translating them. The prompt now asks for the translation of every headline that is not in English, and says it is shown labelled as Claude's translation beside the original. A report that stands in for another website's story (when a website has more than five) also no longer takes over that story's translation, which was of another outlet's headline; it is given its own."
      - "Safety net - at the end of each scan, any headline still without an English translation, from that scan or from the digests of the last 45 days, is translated in one small extra request (a headline Claude finds to be in English is marked and not sent again, unless it looks foreign). The 24, 25 and 26 October digests are filled in by the next scan, or at once by a new task: the Events calendar and weekly summary workflow has a new task, translate missing headlines, that does the same at any time. The translations carry the usual label, English headline translated by Claude, with the original headline beside them."
  - date: 2026-10-26
    title: Suggested issue layout, a table of contents in the brief and a shared planning sheet
    items:
      - "Suggested issue layout - the editor asked for a table of contents. The default layout in config.yaml (issue_layout) follows the magazine's sections since its relaunch in March 2024 and adds four fed by the news desk - 1 Cover story (scanner, 1 story, 4-6 pages), 2 Welcome from the President, 3 Message from the Editor, 4 From the Board / Vice-Presidents' reports, 5 ISSMGE Highlights, 6 Geotechnics in the News (scanner, 10 short items), 7 Lessons from the Field (scanner, 1 developing story), 8 From Research to Practice (scanner, 2 papers), 9 Global News from Member Societies + Regional Insight (society and scanner, one story per ISSMGE region), 10 Technical Committees Activities, 11 Young Members' Arena, 12 Education & Innovation (society and scanner), 13 Corporate Associates Corner, 14 Heritage / Time Capsule, 15 In Memory and 16 Upcoming Events & Calls for Papers (scanner, from the events calendar). Each section says who fills it, how many items the scanner proposes, its usual length and what goes there. Editors can rename, reorder, add or remove sections; a section that cannot be read is repaired or left out with a note, so a typo never stops a scan."
      - "Issue pages - a Suggested table of contents panel shows the layout and which sections the scanner feeds; once config.yaml has planning, sheet_url, a Shared planning sheet (Google Sheets) button opens the team's sheet."
      - "Issue brief - Claude now plans the issue to the layout. The brief opens with a Proposed table of contents: for every section the scanner fills, exactly its number of stories, papers, events or developing stories, each with a one-line reason and whom to check it with; for the sections from ISSMGE or the editor, a short checklist of what to collect, with pointers from the quarter's data (TC symposia and ISSMGE events, member-society countries with no stories, Digital Geotechnics stories). Claude also now reads where each story happened, with its ISSMGE region. Earlier briefs are unchanged. If Claude Opus declines a brief, the API now hands it to Anthropic's recommended fallback model, and the brief says so."
      - "Shared planning sheet - the AI assistant's Google connector (assistant/bridge.gs) can keep a Google spreadsheet for the editorial team. Run setupPlanningSheet once in the Apps Script project; every morning at about 07:00 Cairo time it adds the new stories and papers of the current and previous quarter (best rated first), refreshes the news desk's columns, marks stories no longer in the digest and never changes the team's Status, Assigned to and Editor notes. Each quarter has an issue plan tab built from the layout, with the proposed stories chosen from the quarter's shortlisted headlines. The website publishes the layout for it (exports/layout.json); research papers in the website's data now carry an id."
  - date: 2026-10-25
    title: Copyright-safe outputs
    items:
      - "Before you use a story - the magazine's five steps (treat the news item as a lead; check the facts with the primary source; write in your own words with your own angle; quote a sentence or two at most, in quotation marks, naming and linking the publication; use your own images, press-kit photos released for media use, or ask permission) now appear as a one-line note near the top of every digest and issue page (opened with a click), as a section Using the stories: copyright on the Method & sources page, on the Excel Start here sheet, at the foot of the weekly summary e-mail and page and of the alerts, in this report and in each issue brief."
      - "No publisher's text beyond the headline - the scanner still reads the feeds' summaries and the papers' abstracts during the scan, for the keyword score and Claude's reading, but no longer saves them, and the summaries and abstracts already saved in the 24 and 25 October digests were emptied (nothing else in the digests changed; earlier versions of the files in the repository's Git history still hold them). The story cards, search, the Developing stories page, the Excel and CSV files (the Summary and Abstract columns are gone), the e-mails, the issue brief and the AI assistant show Claude's own angle or note instead, or only the headline and source. The website shows no images from the sources."
      - "Primary source to check - Claude's triage now names, for each story it rates, whom to verify the facts with (the authority, the project owner, the company or the body behind the official report, in at most 12 words). It is shown as Check with on story cards and in Search, in the alerts and the weekly summary, as a new column Primary source to check in the CSV and Excel files, in the AI assistant's context and with each story in the issue brief. Stories rated before today have none."
      - "Own words - the triage prompt now says the angle is written in Claude's own words and never copies the headline or summary; translated headlines are labelled English headline translated by Claude, with the original beside them."
      - "AI assistant - strict new rules: answer and draft in its own words from the facts, never reproduce article text, abstracts or paywalled content, quote at most one or two sentences in quotation marks with the publication named and linked, always list sources with links, name the primary source the editor should check, end every draft of a magazine piece with a short Check before publishing list (facts to confirm with the primary source, quotes to verify, image rights), and for images recommend own photos, press-kit photos released for media use or asking permission, never a source's photos, figures or drawings."
      - "Issue brief - Claude follows the same own-words, short-quote, primary-source and image rules, reads each story's primary source with it, and the Word brief shows Check with beside every story in the line-up, feature leads, Academia-to-Industry topics and watch list (also in briefs written earlier, once their stories have one)."
  - date: 2026-10-25
    title: At most 5 stories per website
    items:
      - No website may now give more than five stories to a digest (max_per_source in config.yaml; 0 = no limit). Vietnam.vn had supplied 16 of the 60 stories on 24 October and 12 of the 47 on 25 October. A website keeps its five best stories and each place this frees goes to the next story of the same theme; when Claude's translations show that another website reported the same event, its report is kept instead. At most 15 stories from one website now go to Claude, so one website cannot fill Claude's list either. Digests already in the archive are left as they are.
      - Copies of one story in several languages count once. Vietnam.vn publishes each story in Vietnamese, English, Chinese and other languages, and Google News lists every copy as a separate story; once Claude has translated the headlines, copies whose English headlines match are merged and the best one is kept, also when a second scan on the same day is merged with the morning's digest. Headlines that only share a place, that differ in a place or a number, or that differ only in a keyword (coastal or riverbank erosion in Ca Mau, when Claude's English translations of headlines in different languages are compared), stay separate stories.
  - date: 2026-10-25
    title: "Developing stories: Sonnet links, Opus checks the unsure cases"
    items:
      - Developing stories are now linked with Claude Sonnet, which also says which cases it is unsure of (two place names in one region, a translated headline that may or may not name the same site, a follow-up whose project name differs). Up to 8 of those per scan are read again by Claude Opus, each against its own closest earlier stories, and its decision stands. If the check fails, Sonnet's reading is kept and the scan notes say why. Settings under storylines (check_model, check_effort, max_checks) in config.yaml; check_model "" turns the check off.
  - date: 2026-10-25
    title: Lower running costs
    items:
      - The AI assistant now starts on Claude Sonnet (half the cost of Opus, still good answers); Opus and Haiku can still be chosen per question.
      - Developing stories are linked with Claude Haiku, the lowest-cost model, and the events calendar is refreshed every 14 days with Claude Sonnet. The issue brief stays on Claude Opus. The daily scan stays daily. The README lists what each part costs.
  - date: 2026-10-25
    title: Catch-up scans and a cheaper events refresh
    items:
      - The first events calendar refresh ran out of Anthropic credit part-way. A refresh now caps how much of each page Claude reads, uses prompt caching, stops near a spending limit (max_cost_usd, US$3) and has Claude write up the events found so far, keeps its notes when a later step fails, retries the next day when Claude was only busy, and ends its log with the tokens, searches and estimated cost.
      - GitHub did not start the 05:00 scan on 25 October (it delays scheduled runs at the start of the hour and sometimes drops them). Two catch-up runs, mid-morning and at midday Cairo time, now scan only if the day has no digest yet, so a missed morning scan is made up the same day.
  - date: 2026-10-24
    title: World map, developing stories, events calendar, alerts and weekly summary
    items:
      - World map - Claude now reads the country and the town, region or site of every story during triage (the place of the event, not the outlet), and stories archived earlier are located after each scan. The new World map page shows stories by country for any issue window, the last 30 days or the whole archive, with ISSMGE's six regions and the member-society countries that had no stories. Issue pages, the weekly summaries and this report show the same regional figures.
      - Developing stories - each scan links a follow-up report to the earlier story about the same event, project or site and names the stage it reports (event, response and recovery, investigation and inquiry, repair and reconstruction, legal and policy, update). The new Developing stories page gives each one a timeline; story cards and search results carry a Developing story chip, and issue pages list the developing stories of the quarter.
      - Events calendar - a new Events page lists ISSMGE conferences, other conferences and courses with their deadlines (calls for papers, registration), from the editors' list (data/events.yaml, editable on GitHub) and a weekly refresh in which Claude reads ten organiser calendars with web search; the Refresh calendar button refreshes it at any time. It can be subscribed to as a calendar feed (events.ics), and the next deadlines and events appear beside the news on the Latest page and on the current issue page.
      - Alerts and weekly summary - an e-mail after any scan that finds a new 5/5 story, and every Monday a summary of the past week for the editorial team. E-mail goes out through the AI assistant's Google connector (assistant/bridge.gs, with a NOTIFY_TOKEN) or a mail server. Every week's summary is also a web page, listed on the Archive page, with a Send summary now button.
      - Linked up across the site - the Latest page has a column beside the news (this week and its summary, upcoming events and deadlines, recently updated developing stories); story cards show where each story happened; the issue brief now lists the quarter's developing stories and the events and deadlines up to six months after it, and Claude uses them for feature leads and the watch list; the Excel workbooks and CSV files have Country, Place and Developing story columns and the workbooks an Events sheet; the AI assistant answers questions about upcoming conferences and the latest on a developing story; this report has new sections on regional coverage, developing stories, the events calendar and the e-mails sent.
      - The menu has nine pages and stays tidy on every screen (shorter names on tablets, a three-by-three grid on phones). A page that cannot be built is now reported and left out instead of stopping the whole website rebuild.
  - date: 2026-10-24
    title: Issue brief, research papers, fixed sources, five more languages and a Trends page
    items:
      - Issue brief (Word) - for each issue window Claude drafts a brief for the editorial meeting - an overview, a proposed line-up per theme, feature leads with the kinds of experts to approach, Academia-to-Industry topics, a regional-balance check, gaps worth covering and a watch list. Drafts appear in the last 21 days of each quarter and are refreshed weekly, the final brief follows the day after the quarter closes, and Generate / update brief on the issue page starts one at any time.
      - Research papers - each scan collects new papers from 25 geotechnical journals through Crossref (Géotechnique, Canadian Geotechnical Journal, ASCE JGGE, Soils and Foundations, Acta Geotechnica and others), with a one-line note from Claude on why each matters for practice. They appear under New research on digest and issue pages, in Search, in the Excel Research sheet and in the issue brief.
      - All 18 failing sources were re-tested from GitHub's network with the new Check feeds workflow. Tunnels & Tunnelling, Rail Technology Magazine and ENR now have working feeds, TunnelTalk is replaced by Tunnelling Journal, Ground Engineering was added, and sites that block automated readers (ISSMGE, ICE, GEER, USGS, GeoEngineer, FHWA, ReliefWeb, Railway Gazette, Rail Business UK, Construction Week, International Construction) are read through Google News searches limited to the site.
      - Five more languages - Vietnamese, Korean, Russian and Polish Google News editions, Persian through six Persian news sites (Google News has no Persian edition), and Spanish-language editions for Colombia, Chile, Peru and Argentina. About 470 new keywords, with word-stem matching for inflected languages.
      - Trends page - stories per month and per quarter by theme, theme shares over time, rising keywords, regions, editorial uses, relevance and sources, with hover details, table views and a CSV download.
      - The Word website report now opens with a summary of what the website does and has sections for research papers and issue briefs.
  - date: 2026-10-24
    title: Balanced digests, same-event merging, interactive Excel workbook
    items:
      - Every digest now spans the magazine's themes. No theme may take more than 30 % of the stories, and themes take turns, so a flood of one kind of story (on 24 October, landslides) can no longer fill the whole digest. A re-scan on the same day re-balances the morning's digest.
      - Several outlets reporting the same event (for example eight reports of one landslide in Moniquirá, Colombia) are merged into one story.
      - Chinese, Japanese, Arabic and Hindi headlines are no longer thrown away as false duplicates of each other.
      - English stories are no longer crowded out by foreign-language results; the language bonus only helps foreign headlines reach Claude.
      - Keyword false matches removed after review - election "landslides", LNG "liquefaction", market slumps (Italian frana, Chinese 滑坡), insolvencies, pile-ups, building land (German Baugrund) and other false friends - and inflected forms such as tunnelling, frane and Erdrutsche added.
      - If Anthropic rejects the API key, the digest notes now say why (for example a key that is cut short, an admin key or a subscription token) without showing the key.
      - The Excel workbooks were redesigned - a Start here sheet, an interactive dashboard whose figures, charts and Top 10 follow dropdown selectors, planning columns (Status, Assigned to, Editor notes), a By theme reading view with collapsible sections, and a Sources sheet.
  - date: 2026-10-24
    title: No more key prompts; clash-proof saving
    items:
      - The website no longer asks for a GitHub token or an Anthropic key. Scan now opens the scan's page on GitHub, where you press Run workflow, and the website then follows the scan and says when the new digest is ready.
      - The AI assistant now talks to a small connector in the editor's own Google account (assistant/bridge.gs), which reads the Anthropic key from the editor's private Google Doc. The key never reaches the website or the repository. Until the connector is set up, the assistant page says so instead of asking for a key.
      - Saving a scan can no longer fail with merge conflicts. A re-run of the first scan on 24 October started from old code and clashed with the newer website; the save step now puts each run's data on the newest version of the site and rebuilds the pages from it.
      - Queued or re-run scans start from the newest version of the repository, not the commit that queued them.
      - The AI assistant was connected to the editor's Google connector. If the connector reports a problem (for example it cannot find or open the key document), the assistant page now shows the reason and what to do.
  - date: 2026-10-24
    title: Multilingual categorisation, Scan button, Excel workbooks, AI assistant and new design
    items:
      - Non-English stories are now tagged and themed through 452 terms in 11 languages, each mapped to an English concept (for example glissement de terrain, deslizamiento, longsor and انهيار أرضي all count as "landslide").
      - Theme matching no longer confuses short words (dam no longer matches damage, ai no longer matches airport).
      - The 24 October digest was re-classified with the new lists.
      - A Scan now button on every page starts a scan from the website; the daily scan also still runs automatically.
      - The daily scan now runs at 05:00 Cairo time all year, following Egypt's summer and winter clocks.
      - Each issue window now has a formatted Excel workbook with a colour-coded dashboard, charts, a theme × use heat map, a filterable story table and a sources sheet. A workbook for the whole archive is also produced.
      - This Word report was added; it is regenerated after every scan.
      - The site has a favicon and a livelier design with a colour and icon for each magazine theme.
      - An AI assistant page answers questions about the archive, recommends stories and reads attached PDF and Word documents.
  - date: 2026-10-24
    title: Keyword ranking fix
    items:
      - When Claude triage is unavailable, stories are ranked on their keywords alone, so untranslated foreign headlines no longer crowd the top of the digest.
  - date: 2026-10-24
    title: Archive website launched
    items:
      - The scan workflow was moved to .github/workflows so GitHub runs it.
      - Every digest is stored permanently and grouped into three-month issue windows matching the magazine's cycle.
      - New pages - latest digest, archive, issue collections, search and method & sources.
      - Claude triage switched to the official Anthropic library with structured output.
      - First scan ran on 24 October 2026 - 704 new items, 60 stories selected.

open_items:
  - "Set up the shared planning sheet: paste the new assistant/bridge.gs into the Apps Script project (keep the link to the key document on line 15), run setupPlanningSheet once and allow the permissions, open the address it logs, share the sheet with the team (Share button) and, if wanted, paste the address into config.yaml under planning, sheet_url (README, Shared planning sheet). Check the suggested issue layout (config.yaml, issue_layout) with the editorial board and adjust the sections, slots and pages."
  - "Set up e-mail: until then no alert or weekly summary is sent (each run's log shows what would have gone out). Paste the new assistant/bridge.gs into the Apps Script project, add the Script property NOTIFY_TOKEN (and MAIL_TO if needed), run testEmail once, deploy a new version, add the same NOTIFY_TOKEN as a GitHub secret, and run the Events calendar and weekly summary workflow with send a test e-mail (README, E-mail alerts and the weekly summary). A mail server (SMTP secrets) also works."
  - "ISSMGE member lists on the world map: the lists for Europe (37 of the 38 societies) and Africa (8 of 13) are incomplete and marked to_check in config.yaml (map: regions). Check them against issmge.org/member-societies, complete them and remove to_check; the map then marks the gaps in those regions correctly."
  - "Events calendar: the weekly refresh needs Anthropic's web search and web fetch tools allowed for the organisation that owns the API key (Claude Console). After the first refresh, read Notes from the last calendar refresh at the foot of the Events page, and add or correct events in data/events.yaml."
  - "Developing stories and locations are suggestions: check a linked report or a story's place at its source before using it. Archived stories are located in batches after each scan, so the map fills in over the first few days."
  - Check the Source health section after the next scans; any site still failing can be tested with the Check feeds workflow.
