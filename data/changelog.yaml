# Change log and open items for the website report (docs/reports/site-report.docx).
# Newest first. The report is rebuilt from this file after every scan.

# What the website does (shown at the start of the report). "Name: description".
features:
  - "Daily scan: every day at 05:00 Cairo time, and on demand with Scan now, the scanner reads specialist, society and trade-press websites, worldwide Google News searches in English and 16 other languages, and new papers from geotechnical journals."
  - "Categorisation: every headline, in any covered language, is scored against weighted geotechnical keywords and filed under one of the magazine's eight themes; Claude then rates its geotechnical substance (1-5), confirms the theme, suggests an editorial use, writes a magazine angle and translates foreign headlines."
  - "Balanced digests: no theme may take more than 30 % of a digest, and several outlets reporting the same event are merged into one story."
  - "Archive: every digest is kept permanently and grouped into three-month issue windows that follow the magazine's cycle, each with an issue page."
  - "Issue brief: for each issue window Claude drafts a Word brief for the editorial meeting - a proposed line-up per theme, feature leads, Academia-to-Industry topics, a regional-balance check and gaps worth covering. Drafts appear in the last weeks of each quarter, a final brief after it closes, and on demand from the issue page."
  - "Research papers: new papers from journals such as Géotechnique, Canadian Geotechnical Journal, ASCE JGGE, Soils and Foundations and Acta Geotechnica arrive through Crossref, with a one-line note on why each matters for practice."
  - "Trends: a page charting stories per month and per quarter by theme, theme shares over time, rising keywords, regions, editorial uses and sources."
  - "Search and AI assistant: search every archived story with filters, or ask the AI assistant, which can also read attached PDF and Word documents."
  - "Excel workbooks: one per issue window and one for the whole archive, with an interactive dashboard, planning columns and a reading view by theme."
  - "Website report: this document, rebuilt after every scan."

changes:
  - date: 2026-10-24
    title: Issue brief, research papers, fixed sources, five more languages and a Trends page
    items:
      - Issue brief (Word) - for each issue window Claude drafts a brief for the editorial meeting - an overview, a proposed line-up per theme, feature leads with the kinds of experts to approach, Academia-to-Industry topics, a regional-balance check, gaps worth covering and a watch list. Drafts appear in the last 21 days of each quarter and are refreshed weekly, the final brief follows the day after the quarter closes, and Generate / update brief on the issue page starts one at any time.
      - Research papers - each scan collects new papers from 25 geotechnical journals through Crossref (Géotechnique, Canadian Geotechnical Journal, ASCE JGGE, Soils and Foundations, Acta Geotechnica and others), with a one-line note from Claude on why each matters for practice. They appear under New research on digest and issue pages, in Search, in the Excel Research sheet and in the issue brief.
      - All 18 failing sources were re-tested from GitHub's network with the new Check feeds workflow. Tunnels & Tunnelling, Rail Technology Magazine and ENR now have working feeds, TunnelTalk is replaced by Tunnelling Journal, Ground Engineering was added, and sites that block automated readers (ISSMGE, ICE, GEER, USGS, GeoEngineer, FHWA, ReliefWeb, Railway Gazette, Rail Business UK, Construction Week, International Construction) are read through Google News searches limited to the site.
      - Five more languages - Vietnamese, Korean, Russian and Polish Google News editions, Persian through six Persian news sites (Google News has no Persian edition), and Spanish-language editions for Colombia, Chile, Peru and Argentina. About 470 new keywords, with word-stem matching for inflected languages.
      - Trends page - stories per month and per quarter by theme, theme shares over time, rising keywords, regions, editorial uses, relevance and sources, with hover details, table views and a CSV download.
      - The Word website report now opens with a summary of what the website does and has sections for research papers and issue briefs.
  - date: 2026-10-24
    title: Balanced digests, same-event merging, interactive Excel workbook
    items:
      - Every digest now spans the magazine's themes. No theme may take more than 30 % of the stories, and themes take turns, so a flood of one kind of story (on 24 October, landslides) can no longer fill the whole digest. A re-scan on the same day re-balances the morning's digest.
      - Several outlets reporting the same event (for example eight reports of one landslide in Moniquirá, Colombia) are merged into one story.
      - Chinese, Japanese, Arabic and Hindi headlines are no longer thrown away as false duplicates of each other.
      - English stories are no longer crowded out by foreign-language results; the language bonus only helps foreign headlines reach Claude.
      - Keyword false matches removed after review - election "landslides", LNG "liquefaction", market slumps (Italian frana, Chinese 滑坡), insolvencies, pile-ups, building land (German Baugrund) and other false friends - and inflected forms such as tunnelling, frane and Erdrutsche added.
      - If Anthropic rejects the API key, the digest notes now say why (for example a key that is cut short, an admin key or a subscription token) without showing the key.
      - The Excel workbooks were redesigned - a Start here sheet, an interactive dashboard whose figures, charts and Top 10 follow dropdown selectors, planning columns (Status, Assigned to, Editor notes), a By theme reading view with collapsible sections, and a Sources sheet.
  - date: 2026-10-24
    title: No more key prompts; clash-proof saving
    items:
      - The website no longer asks for a GitHub token or an Anthropic key. Scan now opens the scan's page on GitHub, where you press Run workflow, and the website then follows the scan and says when the new digest is ready.
      - The AI assistant now talks to a small connector in the editor's own Google account (assistant/bridge.gs), which reads the Anthropic key from the editor's private Google Doc. The key never reaches the website or the repository. Until the connector is set up, the assistant page says so instead of asking for a key.
      - Saving a scan can no longer fail with merge conflicts. A re-run of the first scan on 24 October started from old code and clashed with the newer website; the save step now puts each run's data on the newest version of the site and rebuilds the pages from it.
      - Queued or re-run scans start from the newest version of the repository, not the commit that queued them.
      - The AI assistant was connected to the editor's Google connector. If the connector reports a problem (for example it cannot find or open the key document), the assistant page now shows the reason and what to do.
  - date: 2026-10-24
    title: Multilingual categorisation, Scan button, Excel workbooks, AI assistant and new design
    items:
      - Non-English stories are now tagged and themed through 452 terms in 11 languages, each mapped to an English concept (for example glissement de terrain, deslizamiento, longsor and انهيار أرضي all count as "landslide").
      - Theme matching no longer confuses short words (dam no longer matches damage, ai no longer matches airport).
      - The 24 October digest was re-classified with the new lists.
      - A Scan now button on every page starts a scan from the website; the daily scan also still runs automatically.
      - The daily scan now runs at 05:00 Cairo time all year, following Egypt's summer and winter clocks.
      - Each issue window now has a formatted Excel workbook with a colour-coded dashboard, charts, a theme × use heat map, a filterable story table and a sources sheet. A workbook for the whole archive is also produced.
      - This Word report was added; it is regenerated after every scan.
      - The site has a favicon and a livelier design with a colour and icon for each magazine theme.
      - An AI assistant page answers questions about the archive, recommends stories and reads attached PDF and Word documents.
  - date: 2026-10-24
    title: Keyword ranking fix
    items:
      - When Claude triage is unavailable, stories are ranked on their keywords alone, so untranslated foreign headlines no longer crowd the top of the digest.
  - date: 2026-10-24
    title: Archive website launched
    items:
      - The scan workflow was moved to .github/workflows so GitHub runs it.
      - Every digest is stored permanently and grouped into three-month issue windows matching the magazine's cycle.
      - New pages - latest digest, archive, issue collections, search and method & sources.
      - Claude triage switched to the official Anthropic library with structured output.
      - First scan ran on 24 October 2026 - 704 new items, 60 stories selected.

open_items:
  - Check the Source health section after the next scans; any site still failing can be tested with the Check feeds workflow.
