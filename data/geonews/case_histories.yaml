  - id: S8
    name: "Hidroituango diversion tunnel crisis"
    country: "Colombia"
    region: "South America"
    date: "From 28 Apr 2018 (collapse and blockage of the auxiliary diversion tunnel); acute crisis through May 2018, with floods at Puerto Valdivia on 12 May and further alerts on 16 May"
    anniversary: "28-04"
    outcome: failure
    lives_lost: "none reported"
    what_happened: "The unlined auxiliary diversion tunnel at Hidroituango (on the Cauca River, Antioquia) was carrying the river while the dam was still below its design crest when it collapsed and blocked. Its root-cause analysis (Skava, 2019) traced the collapse to water eroding an untreated shear zone in the tunnel floor. With the outlet blocked, the reservoir rose behind the unfinished dam, so water was sent through the powerhouse caverns; sudden natural unblockings flooded downstream villages such as Puerto Valdivia and led to evacuations of tens of thousands of people."
    lesson: "River diversion works are temporary but critical: unlined tunnel sections in weak or sheared rock need lining or protection, projects need spare diversion capacity until the dam is safely above flood level, and downstream emergency plans must be ready before they are needed."
    framing_note: ""
    theme: "Sustainability & the Energy Transition"
    overview: "https://en.wikipedia.org/wiki/Ituango_Dam"
    sources:
      - title: "Independent Advisory Panel (IAP), First Report on Ituango, September 2018 (IDB Invest)"
