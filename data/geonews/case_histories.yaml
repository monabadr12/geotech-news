        url: "https://www.enr.com/articles/56665-after-15-years-settlement-arrested-at-san-franciscos-millennium-tower"
  - id: S1
    name: "Brumadinho tailings dam failure"
    country: "Brazil"
    region: "South America"
    date: "25 Jan 2019 (shortly after noon local time)"
    anniversary: "25-01"
    outcome: failure
    lives_lost: "270 (272 when two unborn children are counted, as Brazilian authorities and families do)"
    what_happened: "It was Vale's Dam I, an upstream-raised tailings dam about 86 m high that had stopped receiving tailings in 2016; it gave way within seconds when its loose, saturated, brittle tailings underwent flow (static) liquefaction; the expert panel attributed the trigger to creep strains plus loss of suction after heavy late-2018 rain, while a later CIMNE study for Brazil's federal prosecutors pointed to drilling of borehole B1-SM-13 as a possible trigger."
    lesson: "Upstream tailings dams built of loose, saturated, contractive tailings can liquefy suddenly with almost no warning; the disaster led Brazil to ban upstream tailings dams (Minas Gerais state law in 2019, federal Law 14,066 in 2020) and prompted the voluntary Global Industry Standard on Tailings Management (Aug 2020)."
    framing_note: "Start with the victims: 'On 25 January 2019, 270 people died, many of them mine workers, when a tailings dam at the Córrego do Feijão mine near Brumadinho, Brazil, collapsed and buried the mine offices and the valley below; the families count 272, including two unborn children.'"
    theme: "Sustainability & the Energy Transition"
    overview: "https://en.wikipedia.org/wiki/Brumadinho_dam_disaster"
    sources:
      - title: "Robertson, P.K., de Melo, L., Williams, D.J. and Wilson, G.W. Report of the Expert Panel on the Technical Causes of the Failure of Feijão Dam I (12 Dec 2019)"
        url: "https://damfailures.org/sites/default/files/wp-pdf/IR_Feijao-Dam.pdf"
      - title: "CIMNE delivers the final technical report on the Brumadinho disaster to the Brazilian prosecutors office (Oct 2021)"
        url: "https://cimne.com/cimne-delivers-the-final-technical-report-on-the-brumadinho-disaster-to-the-brazilian-prosecutors-office"
      - title: "Global Tailings Review: Global Industry Standard on Tailings Management (Aug 2020)"
        url: "https://globaltailingsreview.org/global-industry-standard/"
  - id: S2
    name: "Fundao tailings dam failure (Mariana)"
    country: "Brazil"
    region: "South America"
    date: "5 Nov 2015 (afternoon, local time)"
    anniversary: "05-11"
    outcome: failure
    lives_lost: "19"
    what_happened: "The upstream-raised dam (Samarco, above Bento Rodrigues near Mariana, Minas Gerais) gave way in a liquefaction flowslide that began at the left abutment. Design changes and drainage problems had let the sand tailings become saturated, and slimes had been deposited where they were never meant to go. A setback of the left abutment then put the embankment on top of those slimes, and as the dam was raised the slimes squeezed out sideways (lateral extrusion), which triggered liquefaction of the loose saturated sands. The panel found that three small earthquakes about 90 minutes before the collapse sped up a failure that was already well advanced, but did not cause it."
    lesson: "An upstream tailings dam on loose sand is safe only while the sands stay drained and the slimes stay out of the structural zone; rising saturation, seepage or cracking should be treated as a liquefaction warning that calls for a change in design or operation, not just a local repair."
    framing_note: "Acknowledge the victims first: \"In November 2015, 19 people died and the village of Bento Rodrigues was destroyed when the Fundão tailings dam failed ...\" Mention that the release polluted the Rio Doce all the way to the Atlantic, and that compensation was still disputed ten years later."
    theme: "Sustainability & the Energy Transition"
    overview: "https://en.wikipedia.org/wiki/Mariana_dam_disaster"
    sources:
      - title: "Fundão Tailings Dam Review Panel (Morgenstern, Vick, Viotti, Watts), Report on the Immediate Causes of the Failure of the Fundão Dam, 25 Aug 2016"
        url: "https://damsafety.org/content/report-immediate-causes-failure-fund%C3%A3o-dam"
        note: "ASDSO library record; the panel's own site was fundaoinvestigation.com."
      - title: "Inzunza, tailings dam breach analysis covering Fundão and Feijão (ISSMGE online library)"
        url: "https://www.issmge.org/uploads/publications/48/118/7iYGEC_Inzunza.pdf"
      - title: "IUCN fact sheet: Impacts of the Fundão dam failure"
        url: "https://iucn.org/resources/factsheet/fact-sheet-impacts-fundao-dam-failure"
  - id: S3
    name: "Itaipu Dam foundations"
    country: "Brazil and Paraguay"
    region: "South America"
    date: "Construction 1975 to 1991. Dam works finished and reservoir filled 13 to 27 Oct 1982; first generating unit started 5 May 1984; 18th unit 1991; units 19 and 20 in 2006 to 2007"
    anniversary: ""
    outcome: success
    lives_lost: "more than 100 construction workers, killed in accidents (Itaipu's own count is reported as 106); none from foundation behaviour"
    what_happened: "The main dam, a hollow concrete gravity dam, stands on a pile of basalt lava flows separated by breccia layers and weak sub-horizontal joints. Borings and exploratory tunnels found an extremely fractured, sheared zone near the base of the dense basalt flow under the riverbed. Engineers drove a grid of tunnels along and across the dam axis, filled them with concrete to form shear keys, and grouted them so that the dam has an adequate margin of safety against sliding."
    lesson: "In layered basalt, the sub-horizontal contacts and shear zones between flows, more than the strong rock itself, can control the sliding stability of a large concrete dam; find them early with adits and tunnels, and treat them directly with concrete shear keys, grouting and drainage."
    framing_note: "Frame it as an engineering success, but do not write that no lives were lost. Workers died building it: \"More than 100 workers died in accidents while Itaipu was being built.\" The reservoir also displaced tens of thousands of people and drowned the Guaíra (Sete Quedas) falls."
    theme: "Sustainability & the Energy Transition"
    overview: "https://www.itaipu.gov.br/en/history"
    overview_title: "Itaipu Binacional"
    sources:
      - title: "Cabrera, J.G. (1988) Foundation investigation and treatment for the main dam, Itaipu Project. 2nd International Conference on Case Histories in Geotechnical Engineering (Scholars' Mine)"
        url: "https://scholarsmine.mst.edu/icchge/2icchge/2icchge-session2/15"
        note: "The record misspells it 'Italpu'."
      - title: "Two practical examples of numerical approaches for solving discontinuity problems in dam design. International Journal for Numerical and Analytical Methods in Geomechanics 6(4), 1982 (covers the Itaipu basalt discontinuities and shear keys)"
        url: "https://doi.org/10.1002/nag.1610060407"
      - title: "Agência Pública (June 2023) Itaipu na ditadura: mais de 100 operários mortos e 43 mil acidentes na construção"
        url: "https://apublica.org/2023/06/itaipu-na-ditadura-mais-de-100-operarios-mortos-e-43-mil-acidentes-na-construcao/"
  - id: S4
    name: "Vargas debris flows"
    country: "Venezuela"
    region: "South America"
    date: "14 to 16 Dec 1999 (storm); the main debris flows struck on 15 to 16 Dec"
    anniversary: "14-12"
    outcome: failure
    lives_lost: "estimated at about 10,000 to 30,000; USGS authors give about 15,000 to 30,000 (19,000 in one fact sheet); only about 1,000 bodies were recovered"
    what_happened: "About 911 mm of rain fell at Maiquetía in 52 hours on 14 to 16 December 1999, on ground already wet from early-December rain. It set off thousands of shallow landslides on the steep slopes of the Sierra de Ávila. These fed debris flows and flash floods that buried the towns built on alluvial fans along about 40 km of the Vargas coast, with deposits up to 5 m thick at Caraballeda."
    lesson: "Coastal alluvial fans are built by past debris flows, so building on them needs debris-flow hazard zoning based on geological evidence of past events; where people stay, engineered measures help (Vargas had 35 sediment-retention dams by 2007), but they do not replace zoning."
    framing_note: "Acknowledge the victims first, and say the true toll will never be known: \"In December 1999 somewhere between 10,000 and 30,000 people died, most of them never found, when debris flows swept the coastal towns of Vargas ...\""
    theme: "Hazards & Resilience"
    overview: "https://pubs.usgs.gov/publication/fs10301"
    sources:
      - title: "Wieczorek, G.F., Larsen, M.C., Eaton, L.S., Morgan, B.A., Blair, J.L. (2001) Debris-flow and flooding hazards associated with the December 1999 storm in coastal Venezuela and strategies for mitigation. USGS Open-File Report 01-0144"
        url: "https://pubs.usgs.gov/of/2001/ofr-01-0144/"
      - title: "USGS Fact Sheet 103-01: Natural hazards on alluvial fans: the Venezuela debris flow and flash flood disaster"
        url: "https://pubs.usgs.gov/publication/fs10301"
      - title: "IWRA World Water Congress paper on sediment-retention dams built in the Vargas torrents after 1999"
        url: "https://iwra.org/proceedings/congress/resource/abs912_article.pdf"
  - id: S5
    name: "Armero lahar (Nevado del Ruiz)"
    country: "Colombia"
    region: "South America"
    date: "13 Nov 1985 (night; lahars reached Armero at about 23:30 local time)"
    anniversary: "13-11"
    outcome: failure
    lives_lost: "more than 23,000 (some sources say about 25,000), most of them in Armero"
    what_happened: "A fairly small eruption of Nevado del Ruiz melted part of the summit snow and ice cap, and the meltwater mixed with loose volcanic debris to form lahars (volcanic debris flows). These ran down the river valleys and reached Armero, which was built on old lahar deposits, more than two hours later; Chinchiná on the other side of the volcano was also hit."
    lesson: "A hazard map that correctly shows where debris flows will go saves no lives unless clear warnings, trusted communication and an evacuation decision follow; risk communication matters as much as the analysis."
    framing_note: "Acknowledge the victims first: \"In November 1985 more than 23,000 people died, most of them in the town of Armero, when lahars from Nevado del Ruiz buried the town ...\""
    theme: "Geotechnics & Society"
    overview: "https://www.usgs.gov/center-news/lessons-learned-armero-colombia-tragedy"
    overview_title: "US Geological Survey"
    sources:
      - title: "Voight, B. (1990) The 1985 Nevado del Ruiz volcano catastrophe: anatomy and retrospection. Journal of Volcanology and Geothermal Research 42, 151-188"
        url: "https://doi.org/10.1016/0377-0273(90)90075-Q"
      - title: "National Research Council (1991) The Eruption of Nevado del Ruiz Volcano, Colombia, South America, November 13, 1985 (Natural Disaster Studies)"
        url: "https://www.nap.edu/read/1784"
      - title: "USGS: Lessons learned from the Armero, Colombia tragedy"
        url: "https://www.usgs.gov/center-news/volcano-watch-lessons-learned-armero-colombia-tragedy"
  - id: S6
    name: "Huascaran avalanche and Yungay"
    country: "Peru"
    region: "South America"
    date: "31 May 1970"
    anniversary: "31-05"
    outcome: failure
    lives_lost: "about 6,000 (census-based re-estimate by Evans et al. 2009); older figures of 18,000 to over 20,000 are widely quoted but probably too high. The earthquake as a whole killed about 66,000"
    what_happened: "The magnitude 7.7 to 7.9 Ancash earthquake shook loose a mass of rock and glacier ice from the North Peak of Huascarán. It picked up snow, moraine and soil, turned into a mud-rich debris flow moving at an estimated 50 to 85 m/s, and also buried part of Ranrahirca; downstream it continued as a debris flood that reached the Pacific, 180 km away."
    lesson: "Rock-ice avalanches that pick up snow and soil on the way can travel much farther and faster than expected, so hazard maps for high mountains must use earlier events from the same source (a smaller 1962 flow from the same peak had already destroyed villages below it) and runout models that include entrainment."
    framing_note: "Acknowledge the victims first, and say the toll is uncertain: \"In May 1970 thousands of people, about 6,000 by the most careful recount, died when an avalanche from Huascarán buried the town of Yungay ...\" Do not use the 18,000 or 20,000 figures without saying they are older estimates."
    theme: "Hazards & Resilience"
    overview: "https://en.wikipedia.org/wiki/1970_Huascar%C3%A1n_debris_avalanche"
    sources:
      - title: "Evans, S.G., Bishop, N.F., Smoll, L.F., Valderrama Murillo, P., Delaney, K.B., Oliver-Smith, A. (2009) A re-examination of the mechanism and human impact of catastrophic mass flows originating on Nevado Huascarán, Cordillera Blanca, Peru in 1962 and 1970. Engineering Geology 108(1-2), 96-118, doi:10.1016/j.enggeo.2009.06.020"
        url: "https://www.sciencedirect.com/science/article/abs/pii/S0013795209001574"
