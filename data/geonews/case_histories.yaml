# Case histories for the "Case history" section of Geo-News Weekly: 50 well-known geotechnical case histories,
# failures and successes, from every ISSMGE region.
# Draft list, checked through web searches on 27 November 2026; to be confirmed by ISSMGE TC302 before items are published.
#
# For each case: id; name; country; region (ISSMGE region); date; anniversary (day and month of the date, DD-MM, e.g.
# "09-10" = 9 October; "" when the date has no single day); outcome (failure or success); lives_lost; what_happened;
# lesson; framing_note (how to introduce the case: where people died, the victims come first); theme (the magazine
# theme); overview (a general page about the case, to read first) and overview_title (the name of its site,
# when it is not one of the sources or Wikipedia); sources (title and link, which readers see under "Read more", and
# sometimes a note: for the editors, which is never shown).
# Each Geo-News draft takes one case (geonews.py choose_case): a case whose anniversary falls in the issue week or the
# week after it, otherwise the next case not used before, regions in turn. A case is never used twice.

cases:
  - id: E1
    name: "Vajont landslide and dam"
    country: "Italy"
    region: "Europe"
    date: "9 Oct 1963 (about 22:39 local time)"
    anniversary: "09-10"
    outcome: failure
    lives_lost: "about 1,900 to 2,000 (1,917 according to Italy's Civil Protection Department)"
    what_happened: "The slide was an ancient landslide on the north flank of Monte Toc, whose sliding surface followed thin clay layers in the limestone. Filling and drawdown of the new reservoir raised water pressures at its toe, and its creep sped up until about 270 million m3 of rock slid into the reservoir. The dam itself stood."
    lesson: "Recognise old landslides on reservoir slopes, and assess how filling and drawdown change their stability before and during impounding; slope monitoring is useful only if people act on what it shows."
    framing_note: "Start with the victims: \"On 9 October 1963 about 1,900 to 2,000 people, most of them in Longarone, died when a landslide fell into the Vajont reservoir and sent a wave over the dam.\" About 400 of them were never found. Avoid calling it a 'dam failure': the dam held."
    theme: "Hazards & Resilience"
    overview: "https://servizio-nazionale.protezionecivile.gov.it/en/pagina-base/vajont-landslide/"
    sources:
      - title: "Genevois, R. and Ghirotti, M. (2005). The 1963 Vaiont landslide. Giornale di Geologia Applicata 1, 41-52"
        url: "https://doi.org/10.1474/GGA.2005-01.0-05.0005"
      - title: "Hendron, A.J. and Patton, F.D. (1985). The Vaiont slide: a geotechnical analysis based on new geologic observations of the failure surface. US Army Corps of Engineers, Technical Report GL-85-5 (Vol. II on DTIC)"
        url: "https://apps.dtic.mil/sti/pdfs/ADA158193.pdf"
      - title: "Dipartimento della Protezione Civile: The Vajont landslide"
        url: "https://servizio-nazionale.protezionecivile.gov.it/en/pagina-base/vajont-landslide/"
  - id: E2
    name: "Aberfan colliery spoil tip"
    country: "United Kingdom (Wales)"
    region: "Europe"
    date: "21 Oct 1966 (about 9:15 am)"
    anniversary: "21-10"
    outcome: failure
    lives_lost: "144, including 116 children"
    what_happened: "Colliery spoil Tip No. 7 had been tipped on a steep hillside over springs and onto debris from earlier slips; water saturated the loose tip, and after heavy rain the toe failed and turned into a fast flow slide that buried Pantglas Junior School and nearby houses."
    lesson: "Spoil tips and other fills on slopes need engineering design, site investigation (including springs and earlier slips), drainage and regular inspection; the disaster led to the Mines and Quarries (Tips) Act 1969."
    framing_note: "Start with the victims: \"On 21 October 1966, 144 people, 116 of them children, died at Aberfan when a colliery spoil tip slid onto the village and its junior school.\" The Tribunal put the blame on the National Coal Board, so do not present this as an unforeseeable natural event."
    theme: "Geotechnics & Society"
    overview: "https://www.bgs.ac.uk/?p=1682"
    overview_title: "British Geological Survey"
    sources:
      - title: "Welsh Office (1969). A Selection of Technical Reports Submitted to the Aberfan Tribunal, HMSO; includes Bishop, Hutchinson, Penman and Evans, 'Geotechnical investigation into the causes and circumstances of the disaster of 21st October 1966'"
        url: "https://pdf.library.soton.ac.uk/BOPCRIS/12816/pdf/12816_1.pdf"
      - title: "UK Government summary: Inquiries - The Aberfan Disaster, 21 October 1966"
        url: "https://assets.publishing.service.gov.uk/media/5a790a75e5274a2acd18bbf6/InquiriesIncidentTheAberfanDisaster21October1966.pdf"
      - title: "Geoscientist (Geological Society), October 2016: Tipping point"
        url: "https://geolsoc.org.uk/Geoscientist/Archive/October-2016/Tipping-point"
  - id: E3
    name: "Malpasset Dam"
    country: "France"
    region: "Europe"
    date: "2 Dec 1959 (shortly after 21:00; 21:13 is often given)"
    anniversary: "02-12"
    outcome: failure
    lives_lost: "423 (official count; some sources give 421 or 'more than 400')"
    what_happened: "As the reservoir rose close to full for the first time after heavy rain, water pressure (uplift) built up in the gneiss below the left abutment and pushed out a rock wedge bounded by a fault and the rock foliation; with its support gone, the thin arch dam broke."
    lesson: "Arch-dam foundations need thorough investigation of faults and joints and design against uplift water pressure, including drainage; the failure was a major spur to modern rock mechanics."
    framing_note: "Start with the victims: \"On 2 December 1959, 423 people died when the Malpasset arch dam failed and its flood swept through the Reyran valley and Fréjus.\""
    theme: "Characterisation & Modelling"
    overview: "https://en.wikipedia.org/wiki/Malpasset_Dam"
    sources:
      - title: "Duffaut, P. and Larouzée, J. (2018). Geology, engineering and humanities: three sciences behind the Malpasset dam failure. Quarterly Journal of Engineering Geology and Hydrogeology (copy hosted by CFBR)"
        url: "https://www.barrages-cfbr.eu/IMG/pdf/2022_06_04_cfbr_malpasset_geology_engineering_humanities_2018-186.full.pdf"
      - title: "Duffaut, P. (2013). The traps behind the failure of Malpasset arch dam, France, in 1959. Journal of Rock Mechanics and Geotechnical Engineering 5(5)"
        url: "https://damsafety.org/reference/traps-behind-failure-malpasset-arch-dam-france-1959"
        note: "ASDSO reference listing."
      - title: "CFBR paper to the 2021 ICOLD Congress (Q.105): Malpasset as an organisational accident"
        url: "https://www.barrages-cfbr.eu/IMG/pdf/2022_06_04_cfbr_malpasset_organisational_accident_cigb21.pdf"
  - id: E4
    name: "Carsington Dam embankment slip"
    country: "United Kingdom"
    region: "Europe"
    date: "4 Jun 1984"
    anniversary: "04-06"
    outcome: failure
    lives_lost: "0"
    what_happened: "Near the end of construction, a long length of the upstream shoulder slid along a surface through the boot-shaped clay core and a thin layer of brittle yellow clay in the foundation, which held old shear surfaces from solifluction; because the clays were brittle and strained unevenly, failure spread progressively and the strength they mobilised was well below peak."
    lesson: "In brittle clays, especially foundations with old shear surfaces, failure can be progressive, so stability worked out with peak strengths and simple slip surfaces can overstate safety; test enough samples, analyse realistic non-circular slip surfaces, and use the instrument readings."
    framing_note: ""
    theme: "Characterisation & Modelling"
    overview: "https://ice.org.uk/what-is-civil-engineering/infrastructure-projects/carsington-dam-reconstruction"
    overview_title: "Institution of Civil Engineers"
    sources:
      - title: "Skempton, A.W. and Vaughan, P.R. (1993). The failure of Carsington Dam. Géotechnique 43(1), 151-173"
        url: "https://doi.org/10.1680/geot.1993.43.1.151"
      - title: "Potts, D.M., Dounias, G.T. and Vaughan, P.R. (1990). Finite element analysis of progressive failure of Carsington embankment. Géotechnique 40(1), 79-101"
        url: "https://doi.org/10.1680/geot.1990.40.1.79"
      - title: "Hansard, 23 July 1986: publication of the final report by R.E. Coxon on the 1984 failure of Carsington embankment dam (HMSO)"
        url: "https://api.parliament.uk/historic-hansard/written-answers/1986/jul/23/carsington-reservoir"
  - id: E5
    name: "Heathrow Express tunnel collapse"
    country: "United Kingdom"
    region: "Europe"
    date: "21 Oct 1994 (began in the night of 20 to 21 Oct; more collapses followed over the next days)"
    anniversary: "21-10"
    outcome: failure
    lives_lost: "0 (no one was hurt)"
    what_happened: "While station tunnels for the Heathrow Express were being built in London Clay with sprayed-concrete (NATM) linings, defects from poor workmanship and repairs went unchecked because engineering control, quality control and the response to monitoring were weak; the linings failed progressively and three parallel tunnels collapsed."
    lesson: "Sprayed-concrete (NATM) tunnels in soft ground need robust design, independent quality control, clear responsibility and quick action on monitoring results; self-certification and thin supervision are not enough."
    framing_note: ""
    theme: "Infrastructure & the Underground City"
    overview: "https://api.parliament.uk/historic-hansard/written_answers/1994/oct/27/heathrow-tunnel"
    overview_title: "Hansard, UK Parliament"
    sources:
      - title: "Health and Safety Executive (2000). The collapse of NATM tunnels at Heathrow Airport. HSE Books, ISBN 0-7176-1792-0"
        url: "https://www.thenbs.com/PublicationIndex/documents/details?DocId=251805&Pub=HSE"
        note: "NBS catalogue entry."
      - title: "Health and Safety Executive (1996). Safety of New Austrian Tunnelling Method (NATM) tunnels: a review of sprayed concrete lined tunnels with particular reference to London Clay"
        url: "https://www.hse.gov.uk/PUBNS/natm.pdf"
      - title: "Muir Wood, A. (2000). Coda: Heathrow tunnel collapse. In Tunnelling: Management by Design. E & FN Spon"
        url: "https://www.taylorfrancis.com/chapters/oa-mono/10.4324/9780203477663-9/coda-heathrow-tunnel-collapse-alan-muir-wood"
  - id: E6
    name: "Cologne City Archive collapse"
    country: "Germany"
    region: "Europe"
    date: "3 Mar 2009"
    anniversary: "03-03"
    outcome: failure
    lives_lost: "2"
    what_happened: "Groundwater and soil broke into the deep (about 28 m) excavation for the Waidmarkt track-switching structure of Cologne's new North-South light-rail line through a defect in its diaphragm wall, and the ground lost from beneath the neighbouring buildings brought down the city archive and two adjacent buildings."
    lesson: "An obstruction or defect met while building a diaphragm wall must be recorded, checked and repaired (for example by grouting) before excavating below the water table next to it; quality assurance and site supervision of the wall are essential."
    framing_note: "Start with the victims: \"On 3 March 2009 two young men died in a neighbouring building when the Cologne City Archive collapsed into a metro excavation.\" Archive staff and visitors escaped after construction workers warned them."
    theme: "Infrastructure & the Underground City"
    overview: "https://en.wikipedia.org/wiki/Historical_Archive_of_the_City_of_Cologne"
    sources:
      - title: "Moormann, C. Collapse of the Historical Archive of the City of Cologne due to underground construction: damage analysis and conclusions for quality assurance and risk management in geotechnical engineering (ISSMGE online library)"
        url: "https://www.issmge.org/uploads/publications/51/135/1._C_Moormann.pdf"
      - title: "Legal Tribune Online (in German): LG Köln on the collapse of the Cologne City Archive, 2018 verdict"
        url: "https://www.lto.de/recht/nachrichten/n/lg-koeln-110kls917-koelner-stadtarchiv-einsturz-strafprozess"
      - title: "Geoengineer.org: Cologne archive collapse - how a 0.6 m void led to Germany's costliest construction failure"
        url: "https://geoengineer.org/news/cologne-archive-collapse-how-a-06m-void-led-to-germanys-costliest-construction-failure"
  - id: E7
    name: "Rissa quick-clay landslide"
    country: "Norway"
    region: "Europe"
    date: "29 Apr 1978"
    anniversary: "29-04"
    outcome: failure
    lives_lost: "1"
    what_happened: "Clay dug out for a barn extension was dumped at the edge of Lake Botn, overloading the shore; a small first slide there spread backwards through highly sensitive quick clay, which turned to liquid, until about 33 hectares of farmland flowed into the lake and raised a wave on the far shore."
    lesson: "Small fills or excavations can trigger large retrogressive slides in quick clay; map sensitive clays and check every fill or cut in those areas, however small."
    framing_note: "Start with the victim: \"On 29 April 1978 one person died when a quick-clay landslide at Rissa took seven farms and five homes into Lake Botn.\" About 40 people were caught in the slide."
    theme: "Hazards & Resilience"
    overview: "https://www.pilegrimsleden.no/en/interest-points/rissa-raset-minnesmerke"
    overview_title: "St. Olav Ways (pilegrimsleden.no)"
    sources:
      - title: "Gregersen, O. (1981). The quick clay landslide in Rissa, Norway. Proc. 10th ICSMFE, Stockholm (also NGI Publication 135)"
        url: "https://www.issmge.org/publications/publication/the-quick-clay-landslide-in-rissa-norway"
      - title: "L'Heureux, J.-S. et al. (2012). The 1978 quick clay landslide at Rissa, mid Norway: subaqueous morphology and tsunami simulations. In Submarine Mass Movements and Their Consequences, Springer"
        url: "https://doi.org/10.1007/978-94-007-2162-3_45"
      - title: "NGI: Large quick clay slides in Norway"
        url: "https://www.ngi.no/en/research-and-consulting/natural-hazards-container/avalanches-and-slides/quick-clay-landslides/large-quick-clay-slides-in-norway/"
  - id: E8
    name: "Leaning Tower of Pisa stabilisation"
    country: "Italy"
    region: "Europe"
    date: "1999-2001 (soil extraction; the tower had been closed since 1990 and reopened in Dec 2001)"
    anniversary: ""
    outcome: success
    lives_lost: "0"
    what_happened: "The tower stands on soft, compressible clays and had been leaning further south for centuries, close to toppling; after temporary measures (lead counterweights on the north side from 1993), small amounts of soil were drawn out through inclined drill holes beneath the north side, so that side settled and the lean fell by about 10 percent (about half a degree)."
    lesson: "Careful, step-by-step soil extraction (underexcavation), guided by trials, modelling and close monitoring, reduced the lean safely; heritage structures are best helped by small, controlled interventions that change the structure as little as possible."
    framing_note: ""
    theme: "Geotechnics & Society"
    overview: "https://ice.org.uk/what-is-civil-engineering/infrastructure-projects/stabilising-the-leaning-tower-of-pisa"
    overview_title: "Institution of Civil Engineers"
    sources:
      - title: "Burland, J.B., Jamiolkowski, M. and Viggiani, C. (2003). The stabilisation of the Leaning Tower of Pisa. Soils and Foundations 43(5), 63-80"
        url: "https://www.jstage.jst.go.jp/article/sandf1995/43/5/43_5_63/_article"
      - title: "Burland, J.B., Jamiolkowski, M. and Viggiani, C. (2009). Leaning Tower of Pisa: behaviour after stabilization operations. International Journal of Geoengineering Case Histories 1(3)"
        url: "https://www.geocasehistoriesjournal.org/issues/volume-1-3/leaning-tower-of-pisa-behaviour-after-stabilization-operations/pdf"
      - title: "Institution of Civil Engineers: Stabilising the Leaning Tower of Pisa"
        url: "https://www.ice.org.uk/what-is-civil-engineering/what-do-civil-engineers-do/stabilising-the-leaning-tower-of-pisa/"
  - id: E9
    name: "Channel Tunnel"
    country: "United Kingdom and France"
    region: "Europe"
    date: "6 May 1994 (formal opening; passenger services from Nov 1994)"
    anniversary: "06-05"
    outcome: success
    lives_lost: "at least 10 construction workers (most sources say 10, eight of them British; one says 11); none from ground failure"
    what_happened: "The tunnels were kept, wherever possible, inside the Chalk Marl (West Melbury Marly Chalk), a layer that is easy to cut and nearly watertight, so open TBMs advanced fast on the UK side; on the French side, where the chalk was folded, faulted and more permeable, sealed earth-pressure-balance TBMs were needed to hold back high water pressure."
    lesson: "Following the Chalk Marl, mapped by detailed site investigation and checked by probing ahead, made the roughly 38 km undersea drives (50.5 km tunnel in all) feasible; where the ground was poorer, the machines had to work in closed mode."
    framing_note: "Workers died building it: \"Ten workers, eight of them British, were killed during construction between 1988 and 1994; their names are on memorials at both terminals.\" Mention them when presenting the project as a success."
    theme: "Infrastructure & the Underground City"
    overview: "https://en.wikipedia.org/wiki/Channel_Tunnel"
    sources:
      - title: "Harris, C.S., Hart, M.B., Varley, P.M. and Warren, C.D. (eds) (1996). Engineering Geology of the Channel Tunnel. Thomas Telford"
        url: "https://www.emerald.com/books/book/13084/chapter/83527352/Chapter-25-Tunnelling-difficulties-working-towards"
        note: "Chapter listing on Emerald / ICE Publishing."
      - title: "Geological Society: GeoSites - Channel Tunnel"
        url: "https://www.geolsoc.org.uk/GeositesChannelTunnel"
      - title: "Institution of Civil Engineers: The Channel Tunnel"
        url: "https://ice.org.uk/what-is-civil-engineering/infrastructure-projects/the-channel-tunnel"
  - id: E10
    name: "Gotthard Base Tunnel"
    country: "Switzerland"
    region: "Europe"
    date: "1 Jun 2016 (opening ceremony; regular service from 11 Dec 2016)"
    anniversary: "01-06"
    outcome: success
    lives_lost: "9 construction workers (between 2002 and 2012); none from ground failure"
    what_happened: "The 57 km twin-bore tunnel, under up to about 2,300 m of rock, crossed weak, squeezing rock in the Tavetsch intermediate massif at Sedrun and other squeezing zones; these were driven with yielding steel arches and deformation allowances adjusted from monitoring, while early exploration showed the feared sugar-like dolomite of the Piora zone did not reach tunnel level."
    lesson: "Deep tunnels through squeezing and faulted rock can be built safely when exploration targets the critical zones early and yielding supports are adjusted to measured deformation, an observational approach."
    framing_note: "Workers died building it: \"Nine workers were killed during construction; a memorial near the north portal honours them.\" Mention them when presenting the project as a success."
    theme: "Infrastructure & the Underground City"
    overview: "https://en.wikipedia.org/wiki/Gotthard_Base_Tunnel"
    sources:
      - title: "Kovári, K., Amberg, F. and Ehrbar, H. (2000). Mastering of squeezing rock in the Gotthard Base Tunnel. World Tunnelling"
        url: "https://www.research-collection.ethz.ch/handle/20.500.11850/119615"
        note: "ETH Research Collection record."
      - title: "ISSMGE Historical Time Capsule, Swiss Geotechnical Society: Gotthard Base Tunnel"
        url: "https://htc.issmge.org/contributions/member-societies/swiss-geotechnical-society-geotechnik-schweiz/gotthard-base-tunnel"
      - title: "AlpTransit Gotthard portal: Keeping danger in check (workplace safety and the nine deaths)"
        url: "https://www.alptransit-portal.ch/en/overview/construction/events/ereignis/keeping-danger-in-check"
  - id: A1
    name: "Nicoll Highway collapse"
    country: "Singapore"
    region: "Asia"
    date: "20 Apr 2004 (about 3:30 pm)"
    anniversary: "20-04"
    outcome: failure
    lives_lost: "4 (construction workers; 3 injured)"
    what_happened: "During excavation of a roughly 30 m deep cut-and-cover tunnel for the MRT Circle Line in soft Kallang Formation marine clay, an under-designed strut-waler connection at the 9th strut level failed, and the diaphragm walls could not take the redistributed load: they had been under-designed because the 'Method A' analysis used drained (effective-stress) strength parameters in an undrained analysis, which overestimated the clay's undrained strength and underestimated wall bending moments and deflections."
    lesson: "In deep excavations in soft clay, base the soil model on measured undrained strength (the inquiry said 'Method B' should have been used), design strut-waler connections so one failure cannot set off a progressive collapse, and act at once when monitoring readings exceed trigger levels."
    framing_note: "In 2004 four construction workers died when the excavation for Singapore's Circle Line collapsed beside Nicoll Highway. Name the human cost first, then the design errors."
    theme: "Infrastructure & the Underground City"
    overview: "https://www.sg101.gov.sg/resources/connexionsg/nicollhigwaycollapse"
    overview_title: "SG101, Government of Singapore"
    sources:
      - title: "Committee of Inquiry into the Incident at the MRT Circle Line Worksite that led to the Collapse of the Nicoll Highway, Final Report (May 2005), Chapter 5 Causation"
        url: "https://www.scribd.com/document/442474347/Report-Cap5-Causation"
        note: "Unofficial copy."
      - title: "Whittle, A.J. and Davies, R.V. (2006) Nicoll Highway collapse: evaluation of geotechnical factors affecting design of excavation support system. Int. Conf. on Deep Excavations, Singapore"
        url: "https://www.scribd.com/doc/246524758/AJWhittle-RVDavis-2006"
        note: "Copy."
      - title: "Revisiting lessons learned from the Nicoll Highway collapse, STRUCTURE magazine"
        url: "https://www.structuremag.org/article/revisiting-lessons-learned-from-the-nicoll-highway-collapse/"
  - id: A2
    name: "Kansai International Airport settlement"
    country: "Japan"
    region: "Asia"
    date: "opened 4 Sep 1994 (1st-phase island)"
    anniversary: "04-09"
    outcome: success
    lives_lost: "0"
    what_happened: "The airport island was built in Osaka Bay on soft Holocene clay, which was improved with sand drains and consolidated quickly, over deep alternating Pleistocene clay and sand-gravel layers. The structured Pleistocene clays keep consolidating slowly because the sand-gravel layers drain poorly, so the island has settled more, and for longer, than first predicted."
    lesson: "Reclamation on thick marine clay settles for decades, including in deep layers below any improved zone, so predict long-term settlement conservatively, keep monitoring it, and build adjustable structures (the Terminal 1 columns sit on jacks that are reset as the ground settles)."
    framing_note: ""
    theme: "Offshore, Coasts & Water"
    overview: "https://www.kansai-airport.or.jp/en/sdgs/2"
    overview_title: "Kansai International Airport"
    sources:
      - title: "Furudoi, T. (2010) The second phase construction of Kansai International Airport considering the large and long-term settlement of the clay deposits. Soils and Foundations 50(6), 805-816"
        url: "https://www.jstage.jst.go.jp/article/sandf/50/6/50_6_805/_article/-char/en"
      - title: "Mimura, M. and Jeon, B.G. (2011) Numerical assessment for the behavior of the Pleistocene marine foundations due to construction of the 1st phase island of Kansai International Airport. Soils and Foundations 51(6), 1115-1128"
        url: "https://repository.kulib.kyoto-u.ac.jp/dspace/bitstream/2433/171980/1/10.3208sandf.51.1115.pdf"
      - title: "Mimura, M. and Jeon, B.G. Long-term deformation of the reclaimed Pleistocene foundation of the offshore twin airport (ISSMGE conference proceedings)"
        url: "https://www.issmge.org/uploads/publications/1/2/559-562.pdf"
  - id: A3
    name: "Niigata earthquake liquefaction"
    country: "Japan"
    region: "Asia"
    date: "16 Jun 1964 (M 7.5, JMA)"
    anniversary: "16-06"
    outcome: failure
    lives_lost: "26 (official Japanese figure); other sources give 28 to 36"
    what_happened: "The earthquake liquefied loose, saturated sands in young Shinano River deposits and filled former river channels in Niigata City. The ground lost bearing capacity, so buildings on shallow foundations settled and tilted (the Kawagishi-cho apartment blocks overturned largely intact), and lateral spreading brought down the Showa Bridge spans."
    lesson: "Loose saturated sands can liquefy in an earthquake, so a site with them needs a liquefaction assessment before buildings are founded on it. Niigata, together with the 1964 Alaska earthquake, launched modern liquefaction engineering (Seed and Idriss 1967)."
    framing_note: "In 1964, 26 people died in the Niigata earthquake, and about 2,000 homes were destroyed. Mention them before the famous images of tilted buildings."
    theme: "Hazards & Resilience"
    overview: "https://www.hp1039.jishin.go.jp/eqchreng/6-2-5.htm"
    overview_title: "Headquarters for Earthquake Research Promotion, Japan"
    sources:
      - title: "Seed, H.B. and Idriss, I.M. (1967) Analysis of soil liquefaction: Niigata earthquake. J. Soil Mech. Found. Div., ASCE 93(3), 83-108"
        url: "https://ascelibrary.com/doi/10.1061/JSFEAQ.0000981"
      - title: "Kishida, H. (1966) Damage to reinforced concrete buildings in Niigata City with special reference to foundation engineering. Soils and Foundations 6(1), 71-88 (doi 10.3208/sandf1960.6.71)"
        url: "https://structurae.net/en/literature/journal-article/damage-to-reinforced-concrete-buildings-in-niigata-city-with-special-reference-to-foundation-engineering"
      - title: "Japan Meteorological Agency, Niigata Local Meteorological Office: earthquake disasters in Niigata (damage figures from Rika Nenpyo and FDMA)"
        url: "https://www.data.jma.go.jp/niigata/menu/bousai/seis_disaster.html"
  - id: A4
    name: "Kobe earthquake port damage and Port Island"
    country: "Japan"
    region: "Asia"
    date: "17 Jan 1995 (5:46 am)"
    anniversary: "17-01"
    outcome: failure
    lives_lost: "6,434 (whole earthquake; final FDMA count, including disaster-related deaths)"
    what_happened: "Strong shaking liquefied the loose reclaimed fill of Port Island and Rokko Island and softened the sand beneath the gravity caisson quay walls, which slid seaward by up to about 5 m (about 3 m on average), settled and tilted, and crippled the port."
    lesson: "Port land reclaimed with loose fill, and the sand under caisson quay walls, should be assessed for liquefaction and densified where needed: at Kobe, the parts of the islands that had been improved settled and were damaged clearly less, even under more than 400 gal of shaking."
    framing_note: "In 1995 the Great Hanshin-Awaji (Kobe) earthquake killed 6,434 people. Acknowledge this before turning to the port, which was a lifeline for relief and recovery."
    theme: "Ground Improvement & Innovation"
    overview: "https://www.mlit.go.jp/kowan/english/pdms/2_6_4.html"
