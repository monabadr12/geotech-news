        url: "https://www.fdma.go.jp/disaster/info/assets/post1.pdf"
  - id: A5
    name: "Hong Kong 1972 landslides and slope safety system"
    country: "Hong Kong, China"
    region: "Asia"
    date: "18 Jun 1972"
    anniversary: "18-06"
    outcome: success
    lives_lost: "138 (71 at Sau Mau Ping and 67 at Po Shan Road; some sources give 70 for Sau Mau Ping)"
    what_happened: "In a torrential rainstorm, a loose, uncompacted fill slope at Sau Mau Ping collapsed onto the squatter huts below, and that evening a hillside above Po Shan Road in the Mid-Levels failed and destroyed homes. Both slopes had been formed without geotechnical control."
    lesson: "A dedicated, government-run slope safety system sharply reduced landslide risk and deaths. Set up in 1977 as the Geotechnical Control Office (renamed the Geotechnical Engineering Office in 1991), it checks new slopes, upgrades old ones and warns the public, and by 2015 the risk from old man-made slopes was below 25% of its 1977 level."
    framing_note: "On 18 June 1972, 138 people died in landslides at Sau Mau Ping and Po Shan Road. Mention them first: the slope safety system was built so that this would not happen again."
    theme: "Geotechnics & Society"
    overview: "https://hkss.cedd.gov.hk/hkss/en/facts-and-figures/past-notable-landslides/index.html"
    overview_title: "Hong Kong Slope Safety, Civil Engineering and Development Department"
    sources:
      - title: "Malone, A.W. (1997) Risk management and slope safety in Hong Kong (GEO technical paper)"
        url: "https://ginfo.cedd.gov.hk/hkss/filemanager/common/publications-resources/list-of-technical-papers/101_Malone (1997)_Risk management and slope safety in Hong Kong.pdf"
      - title: "CEDD: Slope Safety in Hong Kong"
        url: "https://www.cedd.gov.hk/filemanager/eng/content_450/SlopeSafety_in_HongKong.pdf"
      - title: "Hong Kong Fire Services Department: natural disasters in Hong Kong, landslides"
        url: "https://hkfsd.gov.hk/eng/cep_edu/cep/disaster_preparedness/natural_disasters_hk/landslide.html"
  - id: A6
    name: "Shenzhen Guangming landslide"
    country: "China"
    region: "Asia"
    date: "20 Dec 2015"
    anniversary: "20-12"
    outcome: failure
    lives_lost: "73 dead and 4 missing (official investigation); often reported as 77 dead or missing"
    what_happened: "A former quarry pit at Hongao, Guangming New District, used as a construction-waste dump, was filled far beyond its design without adequate drainage or compaction. The saturated, loose fill failed and ran out as a fast flowslide that buried or damaged 33 buildings; the State Council investigation found that it was not a natural landslide."
    lesson: "Uncontrolled dumps of construction waste can fail as large, fast flowslides, so urban fills need engineered design, drainage, compaction, monitoring and enforced regulation, like any other earth structure."
    framing_note: "In December 2015, 73 people died and 4 were never found when a construction-waste dump failed in Shenzhen. Acknowledge them first, then explain why this was a man-made failure."
    theme: "Hazards & Resilience"
    overview: "https://en.wikipedia.org/wiki/2015_Shenzhen_landslide"
    sources:
      - title: "Yin, Y. et al. (2016) Mechanism of the December 2015 catastrophic landslide at the Shenzhen landfill and controlling geotechnical risks of urbanization. Engineering 2(2), 230-249"
        url: "https://www.engineering.org.cn/engi/CN/10.1016/J.ENG.2016.02.005"
      - title: "Xu, Q. et al. (2017) Uncovering the triggering mechanism of the 2015 Shenzhen landslide. Natural Hazards and Earth System Sciences 17, 277-290"
        url: "https://nhess.copernicus.org/articles/17/277/2017/"
      - title: "Ouyang, C. et al. (2017) Dynamic analysis and numerical modeling of the 2015 catastrophic landslide of the construction waste landfill at Guangming, Shenzhen, China. Landslides (doi 10.1007/s10346-016-0764-9)"
        url: "https://doi.org/10.1007/s10346-016-0764-9"
  - id: A7
    name: "Tangjiashan landslide dam"
    country: "China"
    region: "Asia"
    date: "Dam formed 12 May 2008 (Wenchuan earthquake); spillway dug about 26 May to 1 Jun; controlled breach drained the lake on 10 Jun 2008"
    anniversary: "12-05"
    outcome: success
    lives_lost: "None reported from the breach flood (the earthquake itself killed about 69,000)"
    what_happened: "An earthquake-triggered rockslide dammed the Jianjiang River above Beichuan, and the growing lake threatened about 1.3 million people downstream. Engineers cut a spillway about 13 m deep and 475 m long across the dam so that the lake overtopped early and eroded a controlled breach, which on 10 June released about 160 million cubic metres at a peak of about 6,500 cubic metres per second after about 250,000 people had been evacuated."
    lesson: "Rapid assessment of a landslide dam, an excavated spillway that forces an early, smaller, controlled breach, and timely evacuation downstream can turn a potential catastrophe into a managed flood."
    framing_note: "There were no deaths from the breach, but the dam was formed by the Wenchuan earthquake of 12 May 2008, which killed about 69,000 people and left about 18,000 missing. Acknowledge that context briefly before presenting the engineering success."
    theme: "Hazards & Resilience"
    overview: "https://science.nasa.gov/earth/earth-observatory/dam-breach-swells-jianjiang-river-8820/"
    overview_title: "NASA Earth Observatory"
    sources:
      - title: "Cui, P. et al. (2012) Landslide-dammed lake at Tangjiashan, Sichuan province, China (triggered by the Wenchuan Earthquake, May 12, 2008): risk assessment, mitigation strategy, and lessons learned. Environmental Earth Sciences 65(4), 1055-1065"
        url: "https://link.springer.com/10.1007/s12665-010-0749-2"
      - title: "Chen, X.Q., Cui, P., Li, Y. and Zhao, W.Y. (2010) Emergency response to the Tangjiashan landslide-dammed lake resulting from the 2008 Wenchuan Earthquake, China. Landslides"
        url: "https://www.doi.org/10.1007/S10346-010-0236-6"
      - title: "Liu, N. and Yang, Q. (2009) The emergency handling technique and practice of Tangjiashan barrier lake. Strategic Study of CAE 11(6), 74-81"
        url: "https://www.engineering.org.cn/sscae/EN/Y2009/V11/I6/74"
  - id: A8
    name: "Burj Khalifa piled raft foundation"
    country: "United Arab Emirates"
    region: "Asia"
    date: "officially opened 4 Jan 2010"
    anniversary: "04-01"
    outcome: success
    lives_lost: "0 (no failure)"
    what_happened: "The 828 m tower stands on a 3.7 m thick raft on 1.5 m diameter bored piles about 47.5 m long in weak carbonate sediments and rocks. Because the piles work mainly in shaft friction, the design was governed by settlement and by possible cyclic loss of shaft friction under wind loading rather than by bearing capacity; load tests on seven trial piles and eight working piles checked the design, and measured settlements were smaller than predicted."
    lesson: "For a tall building on weak rock, a settlement-based piled raft design, backed by a thorough pile load test programme that covers cyclic loading and by settlement monitoring, can be both safe and economical."
    framing_note: ""
    theme: "Infrastructure & the Underground City"
    overview: "https://www.burjkhalifa.ae/en/the-tower/structures/"
    overview_title: "Burj Khalifa"
    sources:
      - title: "Poulos, H.G. and Bunce, G. (2008) Foundation design for the Burj Dubai, the world's tallest building. 6th Int. Conf. on Case Histories in Geotechnical Engineering, Arlington VA"
        url: "https://scholarsmine.mst.edu/icchge/6icchge/session_01/14"
      - title: "Poulos, H.G. (2016) Tall building foundations: design methods and applications. Innovative Infrastructure Solutions 1, article 10"
        url: "https://link.springer.com/article/10.1007/s41062-016-0010-2"
      - title: "Badelow, F. and Poulos, H.G. Burj Khalifa and Incheon 151 Tower foundations: design and measured performance. Japanese Geotechnical Society Special Publication 2(2)"
        url: "https://www.jstage.jst.go.jp/article/jgssp/2/2/2_ESD-KL-2/_article/-char/en"
  - id: A9
    name: "Highland Towers collapse"
    country: "Malaysia"
    region: "Asia"
    date: "11 Dec 1993"
    anniversary: "11-12"
    outcome: failure
    lives_lost: "48"
    what_happened: "After about ten days of heavy rain, water from a damaged pipe culvert and from poor, unmaintained drains on the hillside above saturated the slope. The high retaining wall behind Block 1 failed, and the retrogressive landslide that followed toppled the 12-storey block."
    lesson: "Slopes and retaining walls above buildings need proper design, working drainage and clear responsibility for maintaining the land upslope, and visible signs of distress must trigger action before failure."
    framing_note: "In December 1993, 48 people died when Block 1 of the Highland Towers in Ulu Klang, Selangor, collapsed. Acknowledge them first; the disaster changed how Malaysia regulates hillside development."
    theme: "Geotechnics & Society"
    overview: "https://en.wikipedia.org/wiki/Highland_Towers_collapse"
    sources:
      - title: "Steven Phoa Cheng Loon & Ors v. Highland Properties Sdn Bhd & Ors, High Court of Malaya, judgment of James Foong J, 11 Aug 2000"
        url: "https://www.hba.org.my/laws/CourtCases/S/steven_phoa.htm"
      - title: "Gue, S.S. and Tan, Y.C. (2006) Landslides: case histories, lessons learned and mitigation measures. Seminar 'Landslide, Sinkhole, Structure Failure: Myth or Science?', Ipoh"
        url: "https://gnpgroup.com.my/wp-content/uploads/2017/03/2006_01.pdf"
      - title: "Case study of the Block 1 Highland Towers collapse using reliability analysis and human factors. Alexandria Engineering Journal (Dec 2023)"
        url: "https://doaj.org/article/21b0e19184b14559ac7aa17cef39da89"
  - id: N1
    name: "Transcona Grain Elevator"
    country: "Canada"
    region: "North America"
    date: "18 Oct 1913"
    anniversary: "18-10"
    outcome: failure
    lives_lost: "0"
    what_happened: "When the new elevator's bins were about 88% full, the pressure under its raft (about 300 kPa) exceeded the strength of the underlying glacial lake clay. A deep failure surface formed in a weaker lower clay layer that the earlier plate load tests had not reached, and the bin house tilted to about 27 degrees within a day."
    lesson: "Plate load tests only stress shallow soil, so bearing capacity must be checked for the full foundation width using the undrained strength of every layer in the zone of influence. Peck and Bryant (1953) later showed that bearing capacity theory predicts the failure load closely."
    framing_note: ""
    theme: "Characterisation & Modelling"
    overview: "https://heritage.enggeomb.ca/index.php/Transcona_Grain_Elevator_Failure_%26_Restoration"
    sources:
      - title: "Canadian Geotechnical Society: Canadian Geotechnical Achievement, Transcona Grain Elevator"
        url: "https://cgs.ca/pdf/heritage/Rev5-CGA19-Transcona-EN.pdf"
      - title: "Puzrin, A.M., Alonso, E.E. and Pinyol, N.M. (2010) Geomechanics of Failures, chapter on the Transcona grain elevator. Springer"
        url: "https://link.springer.com/chapter/10.1007/978-90-481-3531-8_4"
      - title: "Engineers Geoscientists Manitoba Heritage: Transcona Grain Elevator Failure and Restoration"
        url: "https://heritage.enggeomb.ca/index.php/Transcona_Grain_Elevator_Failure_%26_Restoration"
  - id: N2
    name: "St. Francis Dam"
    country: "United States"
    region: "North America"
    date: "12 Mar 1928 (failed just before midnight)"
    anniversary: "12-03"
    outcome: failure
    lives_lost: "at least 431 (USGS; exact number unknown, published counts range from about 411 to 450 or more)"
    what_happened: "The concrete gravity dam collapsed during its first near-full filling because its foundation was poor: the eastern (left) abutment sat on an ancient landslide in weak, foliated Pelona Schist that reactivated, and the western side rested on red Sespe conglomerate that softens when wet, with seepage and uplift along the fault between the two rocks."
    lesson: "Engineering geology must inform dam siting and design, including checks for old landslides, rock that softens when wetted, and uplift; the disaster led California to set up state dam-safety oversight in 1929."
    framing_note: "Start with the victims: 'In March 1928 at least 431 people died when the St. Francis Dam failed shortly before midnight and its flood swept 85 km down the San Francisquito Canyon and Santa Clara River valley to the Pacific.' Many victims were ranch and migrant workers whose names were never recorded, so avoid stating an exact toll."
    theme: "Characterisation & Modelling"
    overview: "https://en.wikipedia.org/wiki/St._Francis_Dam"
    sources:
      - title: "Rogers, J.D. and McMahon, D.J. Reassessment of the St. Francis Dam failure (AEG, Engineering Geology Practice in Southern California, 1992)"
        url: "https://damfailures.org/sites/default/files/wp-pdf/120_Reassessment-of-the-St.-Francis-Dam-Failure.pdf"
      - title: "California Department of Water Resources, Division of Safety of Dams: History of California dam safety"
        url: "https://water.ca.gov/Programs/All-Programs/Division-of-Safety-of-Dams/History"
      - title: "USGS: St. Francis Dam disaster (image page giving the 'at least 431' toll)"
        url: "https://www.usgs.gov/media/images/st-francis-dam-disaster"
  - id: N3
    name: "Teton Dam"
    country: "United States"
    region: "North America"
    date: "5 Jun 1976 (late morning, during first filling)"
    anniversary: "05-06"
    outcome: failure
    lives_lost: "11 (Bureau of Reclamation figure; some accounts give 14, counting indirect deaths)"
    what_happened: "Water flowing through open joints in the fractured rhyolite of the right abutment eroded the highly erodible wind-blown silt core fill in the deep, steep-sided key trench (possibly after hydraulic fracturing of the fill), and the pipe grew until the 93 m high embankment breached within hours."
    lesson: "An erodible core on jointed rock needs several lines of defence: sealing of the foundation surface, filters and drains that can stop internal erosion, and close monitoring during first filling."
    framing_note: "Start with the victims: 'In June 1976, 11 people died when Teton Dam in Idaho failed during its first filling and flooded the towns of the upper Snake River valley.'"
    theme: "Offshore, Coasts & Water"
    overview: "https://www.usbr.gov/pn/snakeriver/dams/uppersnake/teton/"
    overview_title: "US Bureau of Reclamation"
    sources:
      - title: "Independent Panel to Review Cause of Teton Dam Failure: Failure of Teton Dam, report to the U.S. Department of the Interior and State of Idaho (Dec 1976)"
        url: "https://damfailures.org/sites/default/files/wp-pdf/IR_Independent-Investigation_Teton.pdf"
      - title: "Seed, H.B. and Duncan, J.M. The Teton Dam failure: a retrospective review (10th ICSMFE, Stockholm, 1981)"
        url: "https://www.issmge.org/publications/publication/the-teton-dam-failure-a-retrospective-review"
      - title: "U.S. Bureau of Reclamation: Teton Dam history"
        url: "https://www.usbr.gov/pn/snakeriver/dams/uppersnake/teton/index.html"
  - id: N4
    name: "Saint-Jean-Vianney landslide"
    country: "Canada"
    region: "North America"
    date: "4 May 1971 (late evening, about 10:15 to 11 pm)"
    anniversary: "04-05"
    outcome: failure
    lives_lost: "31 (one source gives 30)"
    what_happened: "After a spring thaw and heavy rain in late April and on 3 and 4 May, the sensitive post-glacial marine clay under the village, which sat inside the scar of a slide about 500 years old, failed in a series of retrogressive slides that liquefied and flowed down the Petit Bras valley, removing about 6.9 million m³ of ground and destroying about 40 homes."
    lesson: "Sensitive (quick) clays can fail retrogressively far back from the original slope, and old slide scars mark ground that can fail again; mapping these clays and old scars is essential for land-use planning."
    framing_note: "Start with the victims: 'On the night of 4 May 1971, 31 people died when a flowslide in sensitive clay swept away part of the village of Saint-Jean-Vianney, Quebec; the village was later abandoned.'"
    theme: "Hazards & Resilience"
    overview: "https://en.wikipedia.org/wiki/Saint-Jean-Vianney"
    sources:
      - title: "Tavenas, F., Chagnon, J.-Y. and La Rochelle, P. (1971). The Saint-Jean-Vianney landslide: observations and eyewitnesses accounts. Canadian Geotechnical Journal 8(3): 463-478"
        url: "https://doi.org/10.1139/t71-048"
      - title: "Petley, D. The Saint-Jean-Vianney landslide (AGU Landslide Blog, 19 Mar 2020)"
        url: "https://blogs.agu.org/landslideblog/2020/03/19/saint-jean-vianney-landslide/"
  - id: N5
    name: "1964 Alaska earthquake: Turnagain Heights landslide"
    country: "United States"
    region: "North America"
    date: "27 Mar 1964 (about 5:36 pm local time)"
    anniversary: "27-03"
    outcome: failure
    lives_lost: "4 in the Turnagain Heights slide (local accounts); 131 in the whole earthquake and tsunamis (USGS; NOAA gives 139)"
    what_happened: "During about four and a half minutes of shaking in the magnitude 9.2 earthquake, a strip of bluff about 2.6 km long and up to 270 m deep along Knik Arm slid seaward as blocks, as zones of sensitive Bootlegger Cove clay lost strength and sand lenses within it likely liquefied."
    lesson: "Long-duration shaking can trigger large translational slides in sensitive clay with sand layers; seismic slope assessment must allow for strength loss and shaking duration, and land use should keep housing off such bluffs."
    framing_note: "Acknowledge the victims first: 'The 1964 Great Alaska earthquake and its tsunamis killed 131 people; at Turnagain Heights in Anchorage the ground slid away beneath a neighbourhood, destroying about 75 homes and taking about four lives.'"
    theme: "Hazards & Resilience"
    overview: "https://usgs.gov/centers/alaska-science-center/science/1964-great-alaska-earthquake-and-tsunami"
    overview_title: "US Geological Survey"
    sources:
      - title: "Seed, H.B. and Wilson, S.D. (1967). The Turnagain Heights landslide, Anchorage, Alaska. Journal of the Soil Mechanics and Foundations Division, ASCE 93(SM4): 325-353"
        url: "https://ascelibrary.com/doi/10.1061/JSFEAQ.0000994"
      - title: "Hansen, W.R. (1965). Effects of the earthquake of March 27, 1964, at Anchorage, Alaska. USGS Professional Paper 542-A"
        url: "https://pubs.usgs.gov/pp/0542a/pp542a_text.pdf"
      - title: "Updike, R.G. and others (1988). Geologic and geotechnical conditions adjacent to the Turnagain Heights landslide, Anchorage, Alaska. USGS Bulletin 1817"
        url: "https://pubs.usgs.gov/bul/1817/report.pdf"
  - id: N6
    name: "Oso (SR 530) landslide"
    country: "United States"
    region: "North America"
    date: "22 Mar 2014 (about 10:37 am local time)"
    anniversary: "22-03"
    outcome: failure
    lives_lost: "43"
    what_happened: "After an exceptionally wet late winter, a slope of glacial lake, outwash and till deposits that had slid many times before (most recently in 2006) failed again, and the moving mass liquefied into a fast debris avalanche that crossed the North Fork Stillaguamish valley more than 1 km and also buried State Route 530."
    lesson: "A known landslide can travel much farther than it did before, and runout is very sensitive to the soil's density and water content; hazard maps and land-use rules must cover runout zones, not just the slope."
    framing_note: "Start with the victims: 'On 22 March 2014, 43 people died when the Oso landslide buried the riverside community of Steelhead Haven in Washington State.'"
    theme: "Hazards & Resilience"
    overview: "https://www.usgs.gov/news/featured-story/five-years-later-oso-sr-530-landslide-washington"
    overview_title: "US Geological Survey"
    sources:
      - title: "GEER (Keaton, Wartman et al.). The 22 March 2014 Oso Landslide, Snohomish County, Washington (22 Jul 2014)"
        url: "https://geerassociation.org/components/com_geer_reports/geerfiles/GEER_Oso_Landslide_Report.pdf"
      - title: "Iverson, R.M. et al. (2015). Landslide mobility and hazards: implications of the 2014 Oso disaster. Earth and Planetary Science Letters 412: 197-208"
        url: "https://doi.org/10.1016/j.epsl.2014.12.020"
      - title: "SR 530 Landslide Commission: Final Report (Dec 2014)"
        url: "https://governor.wa.gov/sites/default/files/2022-11/SR530LC_Final_Report.pdf"
  - id: N7
    name: "Mount Polley tailings dam breach"
    country: "Canada"
    region: "North America"
    date: "4 Aug 2014"
    anniversary: "04-08"
    outcome: failure
    lives_lost: "0"
    what_happened: "The perimeter embankment of the tailings storage facility breached when an undrained shear failure developed in a weak glaciolacustrine clay and silt layer (the Upper GLU) about 8 m below the dam base, loaded by an embankment whose downstream rockfill slope had been built at 1.3H:1V; millions of cubic metres of water and tailings flowed into Polley Lake and Hazeltine Creek."
    lesson: "Site investigation must find and characterise continuous weak layers in tailings-dam foundations, and design must check undrained failure of such layers; the panel also called for independent tailings review boards and safer technologies such as filtered tailings."
    framing_note: ""
    theme: "Sustainability & the Energy Transition"
    overview: "https://www2.gov.bc.ca/gov/content/environment/air-land-water/spills-environmental-emergencies/spill-incidents/past-spill-incidents/mt-polley"
    overview_title: "Government of British Columbia"
    sources:
      - title: "Independent Expert Engineering Investigation and Review Panel: Report on Mount Polley Tailings Storage Facility Breach (30 Jan 2015)"
        url: "https://www.mountpolleyreviewpanel.ca/sites/default/files/report/ReportonMountPolleyTailingsStorageFacilityBreach.pdf"
      - title: "Mount Polley Review Panel delivers final report (panel news release)"
        url: "https://www.mountpolleyreviewpanel.ca/node/2831"
      - title: "Engineers and Geoscientists BC: Mount Polley geotechnical report released"
        url: "https://www.egbc.ca/News/News-Releases/Mount-Polley-Geotechnical-Report-Released"
  - id: N8
    name: "Mexico City subsidence and Metropolitan Cathedral"
    country: "Mexico"
    region: "North America"
    date: "underexcavation Aug 1993 to Jun 1998, followed by soil hardening with injected mortar"
    anniversary: ""
    outcome: success
    lives_lost: "0"
    what_happened: "Mexico City's very soft lake clays keep consolidating as groundwater is pumped from beneath the city, and the Metropolitan Cathedral and adjoining Sagrario Church had settled very unevenly; engineers removed small amounts of soil through shafts beneath the parts that had settled least, producing corrective settlements of more than 90 cm, then hardened the clay selectively with injected mortar."
    lesson: "Underexcavation, guided by close monitoring (the observational method), can reduce differential settlement and tilt of a heritage structure without disturbing it, but in a city still subsiding from groundwater pumping some of the correction is lost unless long-term measures follow."
    framing_note: ""
    theme: "Ground Improvement & Innovation"
    overview: "https://en.wikipedia.org/wiki/Mexico_City_Metropolitan_Cathedral"
    sources:
      - title: "Ovando-Shelley, E. and Santoyo, E. (2001). Underexcavation for leveling buildings in Mexico City: case of the Metropolitan Cathedral and the Sagrario Church. Journal of Architectural Engineering, ASCE 7(3): 61-70"
        url: "https://ascelibrary.com/doi/10.1061/%28ASCE%291076-0431%282001%297%3A3%2861%29"
      - title: "Tamez, E., Ovando-Shelley, E. and Santoyo, E. (1997). Invited lecture: Underexcavation of Mexico City's Metropolitan Cathedral and Sagrario Church. 14th ICSMFE, Hamburg"
        url: "https://www.issmge.org/publications/publication/invited-lecture-underexcavation-of-mexico-citys-metropolitan-cathedral-and-sagrario-church"
      - title: "Behavior of Mexico City's Cathedral after underexcavation and subsoil hardening (ISSMGE Online Library)"
        url: "https://www.issmge.org/publications/publication/behavior-of-mexico-citys-cathedral-after-underexcavation-and-subsoil-hardening"
  - id: N9
    name: "Boston Central Artery/Tunnel (Big Dig)"
    country: "United States"
    region: "North America"
    date: "construction 1991 to 2007 (declared complete Dec 2007); jacked tunnels under South Station Oct 1999 to Feb 2001"
    anniversary: ""
    outcome: success
    lives_lost: "none recorded from the geotechnical works; at least 4 construction workers died on the project by 2003, and 1 motorist died in the 2006 I-90 connector ceiling collapse (an epoxy-anchor failure, not geotechnical)"
    what_happened: "Boston replaced its elevated Central Artery with tunnels built through fill and soft Boston Blue Clay beneath a working city, using slurry walls for cut-and-cover sections and, under the live South Station rail yard, jacked concrete tunnel boxes made possible by one of the largest ground-freezing operations ever carried out; a 2004 slurry-wall panel breach that caused heavy leakage was traced by FHWA to poor construction quality control."
    lesson: "Slurry walls, ground freezing and tunnel jacking can deliver major tunnels under a live city and rail yard, but diaphragm-wall construction needs rigorous quality control to stay watertight."
    framing_note: "If the item mentions the project's wider safety record, acknowledge the deaths first and say clearly that the fatal 2006 ceiling collapse was a structural (adhesive-anchor) failure, not a geotechnical one: 'The project's record includes construction workers who died on site and a motorist killed in 2006 when ceiling panels fell in the I-90 connector tunnel.'"
    theme: "Infrastructure & the Underground City"
    overview: "https://www.mass.gov/service-details/the-big-dig-project-background"
    overview_title: "Mass.gov, Commonwealth of Massachusetts"
    sources:
      - title: "Ressi di Cervia, A. (2004). Jacking pits in Boston's Central Artery project. 5th International Conference on Case Histories in Geotechnical Engineering, New York"
