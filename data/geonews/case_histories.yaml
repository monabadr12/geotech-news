        url: "https://ideas.repec.org/a/spr/nathaz/v60y2012i3p1113-1131.html"
  - id: F7
    name: "Jagersfontein tailings dam failure"
    country: "South Africa"
    region: "Africa"
    date: "11 Sep 2022 (morning)"
    anniversary: "11-09"
    outcome: failure
    lives_lost: "3: two confirmed dead and one person missing, never found"
    what_happened: "The southern wall of compartment 2 of a tailings storage facility, raised from 2014 to hold tailings from reprocessing old diamond-mine dumps, breached and released about 5.9 million m3 of fine tailings; the independent university report attributes the failure to a loss of shear strength along zones that had been moving for a long time, with part of the wall founded on a weak older tailings dump."
    lesson: "A tailings dam needs a detailed design, a proper foundation investigation, supervision by a registered engineer, water management (it had no decant system) and monitoring with enforced trigger levels, and raising must stop once deformation appears; this owner kept raising and depositing despite signs of instability reported from as early as 2019."
    framing_note: "Lead with the victims: 'In September 2022 two people died and a third was never found when a tailings dam wall at Jagersfontein collapsed and a flow of mine waste swept through homes downstream.'"
    theme: "Sustainability & the Energy Transition"
    overview: "https://www.gov.za/news/media-statements/deputy-ministers-david-mahlobo-and-sello-seitlholo-release-technical"
    sources:
      - title: "University of Pretoria & University of the Witwatersrand (Sep 2024) Jagersfontein tailings dam failure: Final Report, for the Department of Water and Sanitation"
        url: "https://www.dws.gov.za/DSO/Documents/Jagersfontein%20Final%20Report.pdf"
      - title: "Torres-Cruz & O'Donovan (2023) Public remotely sensed data raise concerns about history of failed Jagersfontein dam. Scientific Reports 13, doi:10.1038/s41598-023-31633-5"
        url: "https://www.nature.com/articles/s41598-023-31633-5.pdf"
      - title: "Deputy Ministers David Mahlobo and Sello Seitlholo release technical report on Jagersfontein tailings dam failure (28 Nov 2025)"
        url: "https://www.gov.za/news/media-statements/deputy-ministers-david-mahlobo-and-sello-seitlholo-release-technical"
  - id: U1
    name: "Thredbo landslide"
    country: "Australia"
    region: "Australasia"
    date: "30 Jul 1997 (about 11:35 to 11:40 pm)"
    anniversary: "30-07"
    outcome: failure
    lives_lost: "18"
    what_happened: "The coroner found that the Alpine Way road embankment above Thredbo village, built of loose, poorly compacted fill, was only marginally stable and became saturated by water leaking from a water main laid in the fill. The lodges it fell on were Carinya and Bimbadeen."
    lesson: "Old uncontrolled fill above occupied buildings must be found, assessed and drained, water services should be kept out of marginally stable fill, and earlier slips must trigger action; the inquest led to Australia-wide adoption of the Australian Geomechanics Society landslide risk management guidelines."
    framing_note: "Lead with the victims: 'In July 1997, 18 people died when a road embankment collapsed onto two ski lodges at Thredbo; one man, Stuart Diver, was rescued alive after more than two days in the rubble.'"
    theme: "Hazards & Resilience"
    overview: "https://knowledge.aidr.org.au/resources/landslide-thredbo-1997/"
    sources:
      - title: "Australian Geomechanics Society: Thredbo Landslide (T. Sullivan), summarising the Coroner's findings (Hand, Report of the inquest into the deaths arising from the Thredbo landslide, 29 Jun 2000)"
        url: "https://australiangeomechanics.org/meetings/thredbo-landslide"
      - title: "Mostyn & Sullivan: Quantitative Risk Assessment of the Thredbo Landslide (Australian Geomechanics)"
        url: "https://australiangeomechanics.org/papers/quantitative-risk-assessment-of-the-thredbo-landslide"
      - title: "Australian Institute for Disaster Resilience: Landslide - Thredbo, New South Wales, July 1997"
        url: "https://knowledge.aidr.org.au/resources/landslide-thredbo-1997/"
  - id: U2
    name: "Christchurch liquefaction (Canterbury earthquakes)"
    country: "New Zealand"
    region: "Australasia"
    date: "4 Sep 2010 (Mw 7.1 Darfield) and 22 Feb 2011 (Mw 6.2, 12:51 pm); liquefaction recurred on 13 Jun and 23 Dec 2011"
    anniversary: "04-09"
    outcome: failure
    lives_lost: "185 (22 Feb 2011; mostly in building collapses); no direct deaths on 4 Sep 2010"
    what_happened: "Strong shaking of loose, saturated young river and estuarine sands and silts under a shallow water table caused widespread liquefaction, again and again across the earthquake sequence, with sand ejecta, settlement and lateral spreading along the Avon River that damaged tens of thousands of homes and the eastern suburbs' infrastructure."
    lesson: "The same ground can liquefy again in later earthquakes, and systematic land-damage mapping linked to a large CPT database let authorities zone land (including a residential red zone of more than 7,000 properties bought out by the Crown) and set foundation requirements by ground category."
    framing_note: "Lead with the victims: 'On 22 February 2011, 185 people died in the Christchurch earthquake, most of them in the central city.' Make clear that the deaths were mainly from building collapse and rockfall, not liquefaction, before turning to the ground damage."
    theme: "Hazards & Resilience"
    overview: "https://teara.govt.nz/en/historic-earthquakes/13"
    overview_title: "Te Ara, the Encyclopedia of New Zealand"
    sources:
      - title: "Cubrinovski et al. (2011) Geotechnical aspects of the 22 February 2011 Christchurch earthquake. Bulletin of the NZ Society for Earthquake Engineering 44(4):205-226, doi:10.5459/bnzsee.44.4.205-226"
        url: "https://bulletin.nzsee.org.nz/index.php/bnzsee/article/view/218"
      - title: "van Ballegooy et al. (2014) Assessment of liquefaction-induced land damage for residential Christchurch. Earthquake Spectra 30(1), doi:10.1193/031813EQS070M"
        url: "https://journals.sagepub.com/doi/full/10.1193/031813EQS070M"
      - title: "Land Information New Zealand: Christchurch residential red zones"
        url: "https://linz.govt.nz/our-work/projects/christchurch-residential-red-zones"
  - id: U3
    name: "Abbotsford landslide"
    country: "New Zealand"
    region: "Australasia"
    date: "8 Aug 1979 (night)"
    anniversary: "08-08"
    outcome: failure
    lives_lost: "0"
    what_happened: "After years of slow creep (cracks noticed from 1969 and broken water mains in 1978 and 1979), a block of about 5 million m3 of Tertiary sand and sandstone slid about 50 m south-east down a dip slope of about 7 degrees on a weak layer near the sand-mudstone contact, after toe support had been removed by sand quarrying at Harrison's Pit and groundwater had risen from rain and leaking mains."
    lesson: "Dip slopes where bedding runs parallel to the hillside need geological assessment before subdivision; excavating the toe and adding water can tip them into failure, and warning signs such as cracks and broken pipes must trigger investigation; the Commission of Inquiry led New Zealand to require geological assessment of land before development."
    framing_note: ""
    theme: "Hazards & Resilience"
    overview: "https://en.wikipedia.org/wiki/1979_Abbotsford_landslip"
    sources:
      - title: "Engineering New Zealand (2022) Lessons learnt from the Abbotsford landslip disaster (summary of webinar by N. Rogers, drawing on the 1980 Commission of Inquiry)"
        url: "https://www.engineeringnz.org/documents/1179/Lesson_Learnt_Abbotsford_Landslip_Disaster_Final.pdf"
      - title: "Geotechnical Report: Abbotsford Landslide (1979, prepared for the Earthquake and War Damage Commission)"
        url: "https://www.naturalhazards.govt.nz/assets/Publications-Resources/4333-Geotechnical-Report-Abbotsford-Landslide-compressed.pdf"
      - title: "D. Petley, AGU Landslide Blog: 30 years ago - the Abbotsford landslide, New Zealand (summarises Hancox 2008, Landslides 5:177-188)"
        url: "https://blogs.agu.org/landslideblog/2009/08/05/30-years-ago-the-abbotsford-landslide-new-zealand/"
  - id: U4
    name: "Kaikoura earthquake road and rail reinstatement"
    country: "New Zealand"
    region: "Australasia"
    date: "14 Nov 2016 (00:02 NZDT; Mw 7.8). SH1 reopened by day on 15 Dec 2017 and 24/7 on 30 Apr 2018; freight rail resumed 15 Sep 2017; recovery programme completed Dec 2020"
    anniversary: "14-11"
    outcome: success
    lives_lost: "2 (earthquake deaths, neither on the transport corridor)"
    what_happened: "The Mw 7.8 multi-fault rupture set off tens of thousands of landslides over more than 10,000 km2, burying State Highway 1 and the Main North rail line along the Kaikoura coast under more than a million tonnes of rock and debris (85 landslides and about 1,500 damaged sites on SH1 alone) and uplifting the shore."
    lesson: "A coastal road and rail corridor cut by dozens of large landslides was rebuilt in about a year by a single alliance (NCTIR) using risk-based slope hazard management, rockfall protection, seawalls and realignment onto the uplifted shore, showing that resilience depends on long-term slope management as well as reopening the road."
    framing_note: "Acknowledge briefly that the earthquake killed two people (one when a homestead collapsed near Kaikoura, one at Mt Lyford) before turning to the reinstatement."
    theme: "Hazards & Resilience"
    overview: "https://nzta.govt.nz/projects/kaikoura-earthquake-response"
    sources:
      - title: "QuakeCoRE-GEER (2017) Geotechnical Reconnaissance of the 2016 Mw7.8 Kaikoura, New Zealand Earthquake (Research Report 2017-07)"
        url: "https://ir.canterbury.ac.nz/items/2f1cca89-9778-45d9-ba20-3ed15ab5d6cb/full"
      - title: "NZ Transport Agency: Kaikoura earthquake response (SH1/rail recovery programme) and NCTIR Kaikoura Recovery Book"
        url: "https://nzta.govt.nz/projects/kaikoura-earthquake-response"
      - title: "USGS Scientific Investigations Report 2017-5146: Overview of the geologic effects of the November 14, 2016, Mw 7.8 Kaikoura, New Zealand, earthquake"
        url: "https://pubs.usgs.gov/publication/sir20175146"
  - id: U5
    name: "Clyde Dam and Cromwell Gorge landslides"
    country: "New Zealand"
    region: "Australasia"
    date: "Landslide investigation and stabilisation mid-1980s to 1992; Lake Dunstan filled in four stages from Apr 1992, completed 1993"
    anniversary: ""
    outcome: success
    lives_lost: "0"
    what_happened: "Investigations for the Clyde hydro scheme found 17 large, slow-creeping landslides in schist along the Cromwell Gorge reservoir margins (the largest, Nine Mile, covers about 700 ha); because filling could reactivate them and a fast slide could send a wave over the dam, nine were stabilised before filling with drainage tunnels and drill holes, pumped drainage, toe buttresses and protection against surface infiltration."
    lesson: "Reservoir-margin landslides must be found and characterised before impoundment, and lowering groundwater with drainage, buttressing the toes and monitoring against piezometric trigger levels let the lake be filled safely; they are still monitored decades later, in contrast to Vajont, where warnings were not acted on."
    framing_note: ""
    theme: "Sustainability & the Energy Transition"
    overview: "https://en.wikipedia.org/wiki/Clyde_Dam"
    sources:
      - title: "Macfarlane, D.F. (2009) Observations and predictions of the behaviour of large, slow-moving landslides in schist, Clyde Dam reservoir, New Zealand. Engineering Geology 109(1-2):5-15, doi:10.1016/j.enggeo.2009.02.005"
        url: "https://structurae.net/en/literature/journal-article/observations-and-predictions-of-the-behaviour-of-large-slow-moving-landslides-in-schist-clyde-dam-reservoir-new-zealand"
      - title: "Geoscience Society of NZ (2016) Field trip guide FT9: Cromwell Gorge, Clyde Dam, Dunstan Fault (GSNZ Annual Conference, Wanaka, Misc. Publ. 145B)"
        url: "https://gsnz.org.nz/assets/Uploads/Shop/Products/GSNZ_annual_conference/MP145_2016_Wanaka/MP145B_2016_GSNZ_Wanaka_FT9_Cromwell_Gorge-Clyde_Dam-Dunstan_Fault-precarious_rocks.pdf"
      - title: "Te Ara: Cairnmuir landslide (Landslides entry)"
        url: "https://teara.govt.nz/en/photograph/8798/cairnmuir-landslide"
  - id: U6
    name: "Brisbane Airport new parallel runway"
    country: "Australia"
    region: "Australasia"
    date: "Ground improvement and reclamation from about 2012 to 2015-17; parallel runway operations began 12 Jul 2020"
    anniversary: ""
    outcome: success
    lives_lost: "0"
    what_happened: "The 360 ha site on the former Brisbane River delta is underlain by very soft, compressible Holocene estuarine clays, so about 11 million m3 of sand dredged from Moreton Bay was pumped on to raise it, about 330,000 prefabricated vertical (wick) drains were installed to depths of up to about 35 m, and the sand fill and surcharge were left for up to about four years to consolidate the clay before the runway was built."
    lesson: "Prefabricated vertical drains with sand preloading and surcharge can make very soft clay fit for an airfield, but only with years of programme time, observational monitoring (settlement plates, piezometers, InSAR) and back-analysis to control remaining total and differential settlement."
    framing_note: ""
    theme: "Ground Improvement & Innovation"
    overview: "https://www.bne.com.au/corporate/projects/completed-projects/brisbanes-new-runway"
    overview_title: "Brisbane Airport"
    sources:
      - title: "ISSMGE conference paper on back-analysis and monitoring of the Brisbane Airport new parallel runway ground improvement"
        url: "https://www.issmge.org/uploads/publications/1/141/982.pdf"
        note: "Title not verified."
      - title: "Brisbane Airport Corporation: Brisbane's New Runway - Dredging and Reclamation Works Fact Sheet"
        url: "https://bne.com.au/sites/default/files/docs/Brisbanes-New-Runway_Dredging-and-Reclamation-Works-Fact-Sheet.pdf"
      - title: "Brisbane Airport Corporation: New Parallel Runway EIS/MDP, Chapter B3 Geology and soils"
