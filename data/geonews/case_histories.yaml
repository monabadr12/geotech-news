  - id: N10
    name: "Millennium Tower settlement"
    country: "United States"
    region: "North America"
    date: "completed 2009; settlement made public Aug 2016; perimeter-pile retrofit completed 2023"
    anniversary: ""
    outcome: failure
    lives_lost: "0"
    what_happened: "The 58-storey tower stands on a mat over more than 900 friction piles 60 to 90 ft (18 to 27 m) long that end in dense sand well above bedrock (about 200 ft down), and it settled far more than the 4 to 6 inches predicted because the deep Old Bay Clay below the pile tips consolidated under the tower load and under groundwater lowering from nearby dewatering and excavations; about 16 inches (40 cm) of settlement and growing tilt were reported in 2016."
    lesson: "Tall buildings on friction piles above thick compressible clay need long-term consolidation analysis that includes neighbouring dewatering and excavation; the retrofit, 18 perimeter piles to bedrock, arrested settlement in 2023 but at first worsened the tilt, so remedial works need the same care."
    framing_note: ""
    theme: "Characterisation & Modelling"
    overview: "https://www.sf.gov/resource/2021/millennium-tower"
    overview_title: "City and County of San Francisco"
    sources:
      - title: "Wagner, N., Murphy, D., Largent, M. and Egan, J. (2021). Tall building foundations: the SF Millennium Tower example. STRUCTURE magazine, May 2021"
        url: "https://www.structuremag.org/wp-content/uploads/2021/05/282106-C-GeotechnicalIssues-Wagner.pdf"
      - title: "Hamburger, R. (2021). Millennium Tower structural repair. STRUCTURE magazine, May 2021"
        url: "https://www.structuremag.org/wp-content/uploads/2021/05/282106-C-StructuralRepair-Hamburger.pdf"
