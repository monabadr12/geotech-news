  - id: S7
    name: "Las Palmas tailings dam flow (Maule earthquake)"
    country: "Chile"
    region: "South America"
    date: "27 Feb 2010 (Mw 8.8 Maule earthquake)"
    anniversary: "27-02"
    outcome: failure
    lives_lost: "4 (one family)"
    what_happened: "The deposit, about 30 km north-west of Talca, held the tailings of a gold mine that had closed in 1997, and they were still saturated. Its dam failed and the tailings flowed more than 350 m downslope in two directions, covering about 8 ha."
    lesson: "A closed tailings deposit can stay saturated and liquefiable for many years, so closure needs a seismic stability assessment, drainage or desaturation, buttressing where needed, and continued monitoring and owner responsibility."
    framing_note: "Acknowledge the victims first: \"In February 2010 four members of one family died when the tailings of the abandoned Las Palmas deposit liquefied in the Maule earthquake and buried their home ...\""
    # Left out of framing_note until a press source is added to the sources below: "Chilean press reported that nearby
    # families had not been warned, although the national mining agency Sernageomin had listed the deposit among the
    # four most at risk of collapse." (Candidates to check: CIPER, 26 Oct 2010, "Minas abandonadas: una amenaza letal
    # para miles de chilenos"; The Clinic, 18 Apr 2019, "Relaves mineros: la amenaza durmiente".)
