  - id: F1
    name: "Merriespruit tailings dam failure"
    country: "South Africa"
    region: "Africa"
    date: "22 Feb 1994 (night)"
    anniversary: "22-02"
    outcome: failure
    lives_lost: "17"
    what_happened: "After a thunderstorm dropped about 50 mm of rain in roughly 30 minutes, the No. 4 tailings dam of the Harmony gold mine at Virginia, Free State, was overtopped. Its pond already held too much water, with too little freeboard. Erosion of the wall exposed loose, metastable tailings that liquefied statically and flowed into the suburb of Merriespruit, destroying about 80 houses."
    lesson: "On a tailings dam, water management is safety management: keep the pond small and away from the wall with adequate freeboard, act on warning signs, and enforce a code of practice; the disaster led directly to South Africa's code of practice for mine residue deposits, SABS 0286 (1998), now SANS 10286."
    framing_note: "Acknowledge the victims first: \"In February 1994 seventeen people died in Merriespruit, a suburb of Virginia in South Africa, when a gold-mine tailings dam failed after a storm ...\" Note that there were warning signs, including a pipeline burst on 11 Feb that sent slimes as far as the houses."
    theme: "Sustainability & the Energy Transition"
    overview: "https://en.wikipedia.org/wiki/Merriespruit_tailings_dam_disaster"
    sources:
      - title: "Fourie, A.B., Blight, G.E., Papageorgiou, G. (2001) Static liquefaction as a possible explanation for the Merriespruit tailings dam failure. Canadian Geotechnical Journal 38(4), 707-719"
        url: "https://doi.org/10.1139/t00-112"
      - title: "ISSMGE Heritage Time Capsule (SAICE Geotechnical Division): 1994 Merriespruit Disaster"
        url: "https://htc.issmge.org/contributions/member-societies/saice-geotechnical-division/1994-merriespruit-disaster-timecapsule"
      - title: "ASDSO reference: Warnings unheeded: the tale of the 1994 Merriespruit tailings dam disaster"
        url: "https://damsafety.org/reference/warnings-unheeded-tale-1994-merriespruit-tailings-dam-disaster"
  - id: F2
    name: "West Driefontein sinkhole"
    country: "South Africa"
    region: "Africa"
    date: "12 Dec 1962"
    anniversary: "12-12"
    outcome: failure
    lives_lost: "29 (the most widely cited figure; early reports and one 1964 report differ)"
    what_happened: "The sinkhole was about 55 m across and at least 30 m deep, and the crusher plant three storeys high. The mines of the Far West Rand were pumping out (dewatering) the karst dolomite above the gold reefs, and the falling water table removed support from soil-filled cavities, causing large-scale sinkhole formation."
    lesson: "Lowering the groundwater in karst dolomite can set off sudden, deadly sinkholes, so dolomite land must be investigated and classified for sinkhole hazard before it is developed or dewatered, as South Africa now requires under SANS 1936."
    framing_note: "Acknowledge the victims first: \"In December 1962, 29 men died when a sinkhole swallowed the crusher plant at West Driefontein gold mine ...\" Contemporary Reuters reports described the dead as African workers; the item can acknowledge that the victims were mineworkers."
    theme: "Characterisation & Modelling"
    overview: "https://paperspast.natlib.govt.nz/newspapers/CHP19621213.2.154"
    overview_title: "Papers Past, National Library of New Zealand"
    sources:
      - title: "Jennings, J.E., Brink, A.B.A., Louw, A., Gowan, G.D. (1965) Sinkholes and subsidences in the Transvaal dolomite of South Africa. Proc. 6th ICSMFE, Montreal (ISSMGE online library)"
        url: "https://www.issmge.org/publications/publication/sinkholes-and-subsidences-in-the-transvaal-dolomite-of-south-africa"
      - title: "Stiff, J., Booyens, H., Mmileng, B. (2025) Protecting infrastructure from dolomite-related subsidence (SRK Consulting)"
        url: "https://cdn-web-content.srk.com/upload/user/image/JStiff_HBooyens_BMmileng_Protecting+Infrastructure+From+Dolomite+Related+Subsidence_2025.pdf"
