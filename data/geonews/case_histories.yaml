  - id: F3
    name: "Kariba Dam plunge pool rehabilitation"
    country: "Zambia and Zimbabwe"
    region: "Africa"
    date: "Plunge pool reshaping: contract signed 14 Feb 2017, works started 2017, cofferdam completed June 2022, excavation finished Dec 2023, reshaping completed and commissioned Sept 2024. The wider Kariba Dam Rehabilitation Project (spillway gates) is due to finish at the end of 2026"
    anniversary: ""
    outcome: success
    lives_lost: "none"
    what_happened: "Frequent spillway releases at Kariba Dam between 1962 and 1981 scoured a hole about 80 m deep (about 85 m at its deepest, after the 1981 flood) in the gneiss bedrock just downstream, and further erosion toward the dam threatened its foundation. Physical model tests at EPFL and numerical scour modelling showed that enlarging the pool downstream by excavating about 300,000 m3 of rock behind a cofferdam would reduce the jet pressures and stop erosion advancing toward the dam."
    lesson: "Rock scour under plunging spillway jets can keep growing for decades even in hard rock; it needs regular survey and scour prediction, and the cure may be to reshape and enlarge the pool, using hybrid physical and numerical modelling, rather than simply filling the hole."
    framing_note: ""
    theme: "Sustainability & the Energy Transition"
    overview: "https://www.zambezira.org/kdrp/about-the-project/overview"
    overview_title: "Zambezi River Authority"
    sources:
      - title: "Bollaert, E., Duarte, R., Pfister, M. et al. (2012) Physical and numerical model study investigating plunge pool scour at Kariba Dam. 24th ICOLD Congress, Kyoto"
        url: "https://infoscience.epfl.ch/record/178315"
      - title: "Zambezi River Authority press release: Update on the Kariba Dam Rehabilitation Project, 26 Dec 2023"
        url: "https://www.zambezira.org/sites/default/files/Press%20Release_Update%20on%20KDRP_26%20December%202023_Final.pdf"
      - title: "George, M.F., Annandale, G.W. (2006) Kariba Dam plunge pool scour. Proc. 3rd International Conference on Scour and Erosion (ICSE-3)"
        url: "https://core.ac.uk/download/326244527.pdf"
  - id: F4
    name: "Aswan High Dam"
    country: "Egypt"
    region: "Africa"
    date: "Built 9 Jan 1960 to 21 Jul 1970; formally inaugurated 15 Jan 1971"
    anniversary: "09-01"
    outcome: success
    lives_lost: "0 from any dam failure. Construction deaths are reported but unverified: popular sources give about 500"
    what_happened: "The 111 m high, 3.8 km long embankment of rockfill and sand with a clay core sits on very deep, permeable Nile alluvium, so seepage was cut off by an upstream impervious blanket and a grout curtain up to about 193 m deep down to bedrock; the dam has performed well, but it traps nearly all of the Nile's sediment in Lake Nasser."
    lesson: "A deep alluvial foundation can be sealed with an upstream blanket and a deep grout curtain, but trapping about 98% of a river's sediment has to be treated as a long-term effect of the design, because it starves the delta coast (the Rosetta and Damietta promontories have retreated sharply) and fills the upper reservoir."
    framing_note: "No failure deaths. If the item mentions the construction toll, use a sourced figure only, since the 'about 500' figure comes from unsourced popular lists. Also consider noting that tens of thousands of Nubians (often given as about 100,000) were moved for the reservoir."
    theme: "Offshore, Coasts & Water"
    overview: "https://en.wikipedia.org/wiki/Aswan_High_Dam"
    sources:
      - title: "Book chapter on grout curtains in overburden, including the High Aswan Dam curtain (CRC Press/Taylor & Francis, ISBN 9781351035989, chapter 9)"
        url: "https://www.taylorfrancis.com/books/9781351035989/chapters/10.1201/9781351035989-9"
        note: "It describes the High Aswan Dam sleeve-pipe curtain as up to 193 m deep and needing no repair as of 2009. Chapter title not verified."
      - title: "Fanos, A.M. (1995) The impact of human activities on the erosion and accretion of the Nile delta coast. Journal of Coastal Research 11(3)"
        url: "https://journals.flvc.org/jcr/article/download/79860/77125"
        note: "On Nile delta erosion after sediment trapping by the High Aswan Dam (retreat of the Rosetta promontory). Title and author as the journal's record (journals.flvc.org/jcr/article/view/79860) gives them in a web search on 27 Nov 2026."
      - title: "ICE: Nile water control (Aswan High Dam)"
        url: "https://ice.org.uk/what-is-civil-engineering/infrastructure-projects/nile-water-control"
  - id: F5
    name: "Freetown (Regent) landslide"
    country: "Sierra Leone"
    region: "Africa"
    date: "14 Aug 2017 (early morning)"
    anniversary: "14-08"
    outcome: failure
    lives_lost: "1,141 dead or missing (final official figure); about 500 bodies were recovered and more than 600 people were never found"
    what_happened: "The slope that failed, part of Sugar Loaf Mountain, had been soaked by three days of intense rain at the peak of the rainy season. It sent about 300,000 m3 of debris into the valley below, where it travelled downstream as a debris flow and flood through densely built settlements."
    lesson: "Most of the deaths came from homes built in the debris runout path and on the valley floor, so mapping landslide source and runout zones (including evidence of earlier landslides) and enforcing land-use controls on steep slopes and stream corridors matters as much as the stability of the slope itself."
    framing_note: "Lead with the victims: 'In August 2017 more than 1,100 people were killed or never found when a hillside above Regent, in Freetown, collapsed after days of heavy rain.' Avoid blaming residents; many lived there because there was no safer housing."
    theme: "Hazards & Resilience"
    overview: "https://www.earthobservatory.nasa.gov/images/91356/a-growing-city-and-a-deadly-landslide"
    overview_title: "NASA Earth Observatory"
    sources:
      - title: "Redshaw et al. (2019) The 2017 Regent landslide, Freetown Peninsula, Sierra Leone. Quarterly Journal of Engineering Geology and Hydrogeology, doi:10.1144/qjegh2018-187"
        url: "https://nora.nerc.ac.uk/id/eprint/523081/"
      - title: "World Bank / GFDRR (2017) Sierra Leone: Rapid Damage and Loss Assessment of August 14th, 2017 Landslides and Floods in the Western Area"
        url: "https://openknowledge.worldbank.org/handle/10986/28836"
      - title: "Landslides (Springer, 2019) paper on the Regent debris slide, debris flow and sediment-laden flood and its links to urbanisation, doi:10.1007/s10346-019-01167-x"
        url: "https://link.springer.com/10.1007/s10346-019-01167-x"
  - id: F6
    name: "Bududa landslide"
    country: "Uganda"
    region: "Africa"
    date: "1 Mar 2010 (afternoon)"
    anniversary: "01-03"
    outcome: failure
    lives_lost: "about 300 dead or missing (estimates range from about 100 to over 300; fewer than 100 bodies recovered)"
    what_happened: "After weeks of heavy rain and a long downpour on 1 March, the slope above the village failed in deeply weathered, clay-rich volcanic soils on the mountain's steep, densely cultivated flanks and turned into a debris flow, which also buried the village's trading centre."
    lesson: "Where people farm steep slopes with clay-rich residual soils, landslide hazard mapping has to be followed by land-use control and timely, planned resettlement; in Bududa resettlement lagged for years and deadly landslides struck the district again in 2012 and 2018."
    framing_note: "Lead with the victims: 'In March 2010 about 300 people were killed or are still missing after a landslide buried much of Nametsi village on Mount Elgon, among them people sheltering in the village health centre.'"
    theme: "Hazards & Resilience"
    overview: "https://en.wikipedia.org/wiki/2010_Ugandan_landslide"
    sources:
      - title: "Landslides in Bududa, Eastern Uganda: Preliminary Assessment and Proposed Solutions. In: Landslide Science and Practice (Margottini, Canuti, Sassa eds., Springer 2013), doi:10.1007/978-3-642-31337-0_19"
        url: "https://link.springer.com/chapter/10.1007/978-3-642-31337-0_19"
      - title: "Knapen et al. (2006) Landslides in a densely populated county at the footslopes of Mount Elgon (Uganda): Characteristics and causal factors. Geomorphology 73:149-165, doi:10.1016/j.geomorph.2005.07.004"
        url: "https://nru.uncst.go.ug/handle/123456789/3976"
