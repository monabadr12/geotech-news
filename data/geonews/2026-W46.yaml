    text: "Combines large-scale pile tests with finite element checks for offshore wind jacket foundations, directly informing stiffness and load-displacement assumptions in design."
  - paper: "445edb36179dc008"   # Dynamic monitoring and prediction method for remedial grouting of in-service immersed tunnel sand foundation
    text: "Offers a way to monitor and predict how remedial grouting performs beneath an operating immersed tunnel, helping engineers judge when a sand foundation has been adequately stabilised."
  - paper: "7e19200a635db8b5"   # Extrapolation-induced reversal of apparent geosynthetic benefit in cyclic plate load testing
    text: "Warns that extrapolating cyclic plate load test results can overstate geosynthetic benefit, so engineers should check test interpretation before crediting reinforcement in pavement design."

