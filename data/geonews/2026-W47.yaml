# CASE HISTORY: a well-known case from data/geonews/case_histories.yaml, kept apart from the news. To use
# another case, write its id after case: (the preview page suggests three) and empty the text (""): the
# page then writes the text from the list. Change the text as you wish; delete these lines for no case history.
case_history:
  case: E1   # Vajont landslide and dam (Italy, 9 Oct 1963)
  text: "On 9 October 1963 about 1,900 to 2,000 people, most of them in Longarone, died when a landslide fell into the Vajont reservoir and sent a wave over the dam. About 400 of them were never found. The slide was an ancient landslide on the north flank of Monte Toc, whose sliding surface followed thin clay layers in the limestone. Filling and drawdown of the new reservoir raised water pressures at its toe, and its creep sped up until about 270 million m³ of rock slid into the reservoir. The dam itself stood. Lesson for practice: Recognise old landslides on reservoir slopes, and assess how filling and drawdown change their stability before and during impounding; slope monitoring is useful only if people act on what it shows."

