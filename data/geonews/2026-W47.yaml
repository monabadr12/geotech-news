    text: "A monitored deep excavation in soft clay gives observed movements and controlling factors that engineers can benchmark against similar urban excavations."
  - paper: "906ad45e13323217"   # Real-time identification of adverse geological zones in tunnels based on continuous drilling parameters
    text: "Using drilling data in real time to flag adverse geology ahead of the face gives tunnel crews an immediate, low-cost warning tool they can apply on site now."
  - paper: "2ec5db2441485856"   # Mechanism of pipe sticking and jacking force prediction for steel pipe jacking under deeply buried and water-r
    text: "A real case of pipe sticking and jacking force in water-rich strata gives engineers a direct, calibrated approach to plan steel pipe jacking in similar ground."

