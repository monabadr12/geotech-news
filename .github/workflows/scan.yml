name: Geotechnical news scan

on:
  schedule:
    # 05:00 Cairo time every day. GitHub schedules run in UTC and Egypt
    # changes its clocks in summer, so both candidate times are scheduled
    # and the "Check the time" step lets through only the one that is 05:00
    # in Cairo: 02:00 UTC in summer (UTC+3), 03:00 UTC in winter (UTC+2).
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:   # "Run workflow" button on GitHub and the website's "Scan now" button
  push:                # rebuild the website (no scan) when its design or settings change
    branches: [main]
    paths: [site_builder.py, exports.py, report.py, brief.py, geomap.py, storylines.py, events.py, notify.py,
            assets/**, config.yaml, data/changelog.yaml, data/briefs/**, data/events.yaml, sync_data.py]

permissions:
  contents: write

concurrency: news-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check the time
        id: gate
        run: |
          offset=$(TZ=Africa/Cairo date +%z)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 2 * * *" ] && [ "$offset" != "+0300" ]; then run=false; fi
            if [ "${{ github.event.schedule }}" = "0 3 * * *" ] && [ "$offset" != "+0200" ]; then run=false; fi
          fi
          echo "Cairo UTC offset $offset, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.ref }}   # the branch tip when the job starts, not the commit that queued it
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Scan sources and build digest
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        run: python scanner.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Events calendar (refreshed once a week)
        # Claude reads the organisers' event calendars. A refresh that fails is a note in
        # the log, never a failed scan: the calendar keeps the events it already has.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 20
        run: python events.py --auto || echo "::warning::The events calendar could not be refreshed; see this step's log."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Issue brief (when one is due)
        # The final brief of a quarter that has just closed, and a draft in the last weeks of
        # the current one. A brief that fails is a note in the log, never a failed scan.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python brief.py --auto || echo "::warning::The issue brief could not be written; see this step's log."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Alerts and weekly summary (e-mail)
        # An e-mail for new 5/5 stories, and on Mondays the summary of the past week.
        # Without e-mail settings this only notes in the log what would have been sent.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
        run: python notify.py --auto || echo "::warning::An alert or the weekly summary could not be sent; see this step's log."
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Save digest and memory
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "news-scanner"
          git config user.email "news-scanner@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then msg="Rebuild website"; else msg="Digest $(date -u +%F)"; fi
          # Put this run's data on the newest main and rebuild the site from it, so the
          # save never clashes with changes made while the scan was running.
          for attempt in 1 2 3; do
            python sync_data.py "${GITHUB_REF_NAME}"
            git add docs data
            if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
            git commit -q -m "$msg"
            if git push; then exit 0; fi
            echo "The branch moved while saving; trying again ($attempt)."
            git reset -q --soft HEAD~1
          done
          exit 1
