name: Geotechnical news scan

on:
  schedule:
    # 05:00 Cairo time every day. GitHub schedules run in UTC, often hours late,
    # and sometimes drop runs. So there are several start times, and the
    # "Check the time" step scans on whichever comes first after 05:00 in Cairo
    # once the day has no digest yet; the later ones then do nothing.
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "41 4 * * *"
    - cron: "37 5 * * *"
    - cron: "23 6 * * *"
    - cron: "47 7 * * *"
    - cron: "13 9 * * *"
    - cron: "29 11 * * *"
  workflow_dispatch:   # "Run workflow" button on GitHub and the website's "Scan now" button
  push:                # rebuild the website (no scan) when its design or settings change
    branches: [main]
    paths: [site_builder.py, exports.py, report.py, brief.py, geomap.py, storylines.py, events.py, notify.py,
            assets/**, config.yaml, data/changelog.yaml, data/briefs/**, data/events.yaml, sync_data.py,
            geonews.py, data/geonews/**, .github/workflows/scan.yml]

permissions:
  contents: write

concurrency: news-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # the branch tip when the job starts, not the commit that queued it
      - name: Check the time
        id: gate
        run: |
          offset=$(TZ=Africa/Cairo date +%z)
          hour=$(TZ=Africa/Cairo date +%-H)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$hour" -lt 5 ]; then run=false; echo "Before 05:00 in Cairo: waiting for a later start."
            elif [ -f "data/digests/$(date -u +%F).json" ]; then run=false; echo "Today's digest exists, so nothing more to do."
            else echo "No digest yet today: scanning now."; fi
          fi
          echo "Cairo UTC offset $offset, run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Scan sources and build digest
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        run: python scanner.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Events calendar (refreshed once a week)
        # Claude reads the organisers' event calendars. A refresh that fails is a note in
        # the log, never a failed scan: the calendar keeps the events it already has.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 20
        run: python events.py --auto || echo "::warning::The events calendar could not be refreshed; see this step's log."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Issue brief (when one is due)
        # The final brief of a quarter that has just closed, and a draft in the last weeks of
        # the current one. A brief that fails is a note in the log, never a failed scan.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 30
        run: python brief.py --auto || echo "::warning::The issue brief could not be written; see this step's log."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Alerts and weekly summary (e-mail)
        # An e-mail for new 5/5 stories, and on Mondays the summary of the past week.
        # Without e-mail settings this only notes in the log what would have been sent.
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 10
        run: python notify.py --auto || echo "::warning::An alert or the weekly summary could not be sent; see this step's log."
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Geo-News Weekly (draft and e-mails)
        # Monday: the draft of last week's members' page, and an e-mail to the editorial team. After the MPC
        # editor approves an issue (status: approved, a push that runs this workflow): the e-mail with the
        # LinkedIn post. Never fails the run.
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: python geonews.py --auto || echo "::warning::Geo-News Weekly - the draft or an e-mail failed; see this step's log."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEONEWS_REVIEWERS: ${{ secrets.GEONEWS_REVIEWERS }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Save digest and memory
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "news-scanner"
          git config user.email "news-scanner@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then msg="Rebuild website"; else msg="Digest $(date -u +%F)"; fi
          # Put this run's data on the newest main and rebuild the site from it, so the
          # save never clashes with changes made while the scan was running.
          for attempt in 1 2 3; do
            python sync_data.py "${GITHUB_REF_NAME}"
            git add docs data
            if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
            git commit -q -m "$msg"
            if git push; then exit 0; fi
            echo "The branch moved while saving; trying again ($attempt)."
            # not --soft: new files (a Geo-News draft, satellite pictures) must be untracked again, or the
            # reset --hard in sync_data.py deletes them on the next attempt
            git reset -q HEAD~1
          done
          exit 1
      - name: Publish Geo-News Weekly to its own website
        # Copies the published issues (no previews, nothing of the News Desk) to the newsletter's own repository
        # (config.yaml geonews: public_repo), whose GitHub Pages site is the address members use. Needs the secret
        # GEONEWS_DEPLOY_TOKEN (a token that may write to that repository only); without it this step does nothing.
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          TOKEN: ${{ secrets.GEONEWS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No GEONEWS_DEPLOY_TOKEN secret: the newsletter's own website is not updated."; exit 0; fi
          target=$(python -c "import yaml; print((yaml.safe_load(open('config.yaml')).get('geonews') or {}).get('public_repo') or '')")
          if [ -z "$target" ]; then echo "config.yaml geonews: public_repo is empty: nothing to publish to."; exit 0; fi
          python geonews.py --public-bundle /tmp/geonews-site
          git clone --quiet "https://x-access-token:${TOKEN}@github.com/${target}.git" /tmp/geonews-repo
          cd /tmp/geonews-repo
          git checkout -q -B main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/geonews-site/. .
          git add -A
          if git diff --cached --quiet; then echo "The newsletter's website is up to date."; exit 0; fi
          git -c user.name="news-scanner" -c user.email="news-scanner@users.noreply.github.com" commit -q -m "Update Geo-News Weekly"
          git push --quiet origin main
          echo "Published to https://github.com/${target}"
